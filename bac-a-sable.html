    var i = parseInt(ks, 10), L = M.decors[ks] || [];
    L.forEach(function(q, n){
      var f = FAIRE_D[q.k]; if(!f) return;
      var g = f();
      g.userData = { cell:i, idx:n, type:"dec" };
      placerLibre(i, g, q);
      g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
      monde.add(g); decorsG.push(g);
    });
  });
}
function detaillerObjets(on){
  detailles.forEach(function(i){ if(M.cells[i]) poser(i, M.cells[i], true); });
  detailles = [];
  if(!on || !patchCells) return;
  patchCells.forEach(function(i){
    var id = M.cells[i];
    if(!id || !FAIRE2[id] || !objets[i]) return;
    monde.remove(objets[i]); delete objets[i];
    var g = FAIRE2[id]();
    g.scale.setScalar(ECHC);
    g.userData = { cell:i, type:"obj" };
    placerObjet(i, g);
    g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
    monde.add(g); objets[i] = g; detailles.push(i);
  });
}

/* ═══════════════ acheter et manipuler au sol ═══════════════ */
function decorsOuverts(){
  return ORDRE_DEC.filter(function(k){
    var o = DECORS[k]; return !o.req || !!M.glob[o.req];
  });
}
function choisirDecor(k){
  var o = DECORS[k];
  if(selDec === k){ selDec = null; remplirListe(); dire(""); return; }
  if(o.prix > solde()){
    dire("Il manque " + (o.prix - solde()) + " cristaux pour " + o.nom.toLowerCase() + ".");
    return;
  }
  selDec = k; selSol = null; armeDeplacer = false; remplirListe();
  dire("Touche le sol à l'endroit où poser " + o.nom.toLowerCase() + ".");
}
function poserDecor(i, k, ad){
  var o = DECORS[k];
  if(bioDe(i) === "ocean"){ dire("Ça ne tient pas sur l'eau."); return; }
  if(o.prix > solde()){ dire("Il manque " + (o.prix - solde()) + " cristaux."); return; }
  if(!M.decors[i]) M.decors[i] = [];
  if(M.decors[i].length >= 8){ dire("Cette case est déjà bien occupée."); return; }
  M.decors[i].push({ k:k, a:ad.a, d:Math.min(.64, ad.d),
    r: alea(i*13 + M.decors[i].length) * 6.28319 });
  sauver(); poserDecors(); majSolde();
  if(o.prix > solde()){ selDec = null; dire("C'est posé. Il faudra revenir jouer pour continuer."); }
  else dire("C'est posé. Tu peux en poser d'autres, ou toucher un objet pour le déplacer.");
  remplirListe();
}
function nomSel(){
  if(!selSol) return "";
  var u = selSol.userData;
  if(u.type === "bete") return defBete(u.k) ? defBete(u.k).nom : "Cet animal";
  if(u.type === "obj") return OBJETS[M.cells[u.cell]] ? OBJETS[M.cells[u.cell]].nom : "Cet objet";
  var L = M.decors[u.cell];
  return (L && L[u.idx] && DECORS[L[u.idx].k]) ? DECORS[L[u.idx].k].nom : "Ce décor";
}
function montrerSel(){
  if(!selSol){ dire(""); return; }
  dire(nomSel() + (armeDeplacer ? " — touche le sol à l'endroit voulu." : " est en main."),
    { tou:1, dep:1, sup:1 });
}
function tourner(){
  if(!selSol) return;
  var u = selSol.userData;
  if(u.type === "obj"){
    var q = M.pos[u.cell] || { a:0, d:0, r:0 };
    q.r = ((q.r || 0) + .6283) % 6.28319;
    M.pos[u.cell] = q; sauver(); placerObjet(u.cell, selSol);
  } else if(u.type === "bete"){
    var B = M.betes[u.cell]; if(!B || !B[u.idx]) return;
    B[u.idx].r = ((B[u.idx].r || 0) + .6283) % 6.28319;
    sauver(); selSol.userData.cap = B[u.idx].r; placerBete(selSol);
  } else {
    var L = M.decors[u.cell]; if(!L || !L[u.idx]) return;
    L[u.idx].r = ((L[u.idx].r || 0) + .6283) % 6.28319;
    sauver(); placerLibre(u.cell, selSol, L[u.idx]);
  }
  montrerSel();
}
function retirerSel(){
  if(!selSol) return;
  var u = selSol.userData;
  if(u.type === "bete"){ retirerBete(selSol); return; }
  if(u.type === "dec"){
    var L = M.decors[u.cell]; if(!L) return;
    L.splice(u.idx, 1);
    if(!L.length) delete M.decors[u.cell];
    selSol = null; armeDeplacer = false;
    sauver(); poserDecors(); majSolde(); remplirListe();
    dire("C'est repris, les cristaux sont revenus.");
  } else {
    var c = u.cell;
    selSol = null; armeDeplacer = false;
    detailles = detailles.filter(function(x){ return x !== c; });
    delete M.pos[c];
    retirer(c);
    dire("C'est repris, les cristaux sont revenus.");
  }
}

/* ═══════════════ retoucher le terrain ═══════════════
   Sculpter ne coûte rien. Les cristaux paient les choses — les transformations,
   les objets, les décors ; la forme du sol, elle, est de l'expression, et on
   doit pouvoir revenir sur une maladresse sans que cela se paie. C'est aussi ce
   qui évite qu'un patient reste bloqué devant une case qu'il a ratée. */
var outil = null, presse = null, globeSale = false;
var SOLS = [
  { id:"ocean",    nom:"De l'eau",   ic:"💧", req:"eau" },
  { id:"plage",    nom:"Du sable",   ic:"🏖", req:"eau" },
  { id:"plaine",   nom:"De l'herbe", ic:"🌿", req:"herbe" },
  { id:"montagne", nom:"De la roche",ic:"⛰", req:"relief" },
  { id:"desert",   nom:"Du désert",  ic:"🏜", req:"climat" },
  { id:"toundra",  nom:"De la toundra", ic:"🍂", req:"climat" },
  { id:"neige",    nom:"De la neige",ic:"❄", req:"relief" },
  { id:"banquise", nom:"De la banquise", ic:"🧊", req:"climat" }
];
function solsOuverts(){
  return SOLS.filter(function(s){ return !s.req || !!M.glob[s.req]; });
}
function choisirOutil(k){
  if(outil === k){ outil = null; presse = null; remplirListe(); dire(""); return; }
  outil = k; selObj = null; selDec = null; selSol = null; armeDeplacer = false;
  remplirListe();
  if(k === "haut") dire("Touche une case pour la soulever d'un cran.");
  else if(k === "bas") dire("Touche une case pour l'enfoncer d'un cran.");
  else if(k === "copier") dire("Touche la case dont tu veux reprendre le sol.");
  else dire("Touche les cases à recouvrir.");
}
function appliquerOutil(i){
  if(!outil) return false;
  var t = M.terre[i] || {};
  if(outil === "copier"){
    presse = { b:bioDe(i), h:cranDe(i) };
    outil = "coller"; remplirListe(); surligner(i);
    dire("Ce sol est en main. Touche les cases où le poser.");
    return true;
  }
  if(outil === "coller"){
    if(!presse) return true;
    t.b = presse.b; t.h = presse.h;
  } else if(outil === "haut" || outil === "bas"){
    t.h = Math.max(-3, Math.min(4, (t.h || 0) + (outil === "haut" ? 1 : -1)));
  } else {
    t.b = outil;
  }
  if(!t.h) delete t.h;
  if(t.b === INFO[i].b) delete t.b;
  couleursSales = true;
  if(t.b === undefined && t.h === undefined) delete M.terre[i];
  else M.terre[i] = t;
  /* ce qui était posé sur une case devenue eau revient au patient entier */
  if(bioDe(i) === "ocean"){
    if(M.cells[i]) retirer(i);
    if(M.decors[i]){ delete M.decors[i]; poserDecors(); majSolde(); }
  }
  sauver();
  dernierEdit = performance.now();
  refaireTerrain(i);
  var nb = bioDe(i), cr2 = cranDe(i);
  dire(NOM_BIOME[nb].charAt(0).toUpperCase() + NOM_BIOME[nb].slice(1)
    + (cr2 ? (cr2 > 0 ? " · +" + cr2 : " · " + cr2) : "") + ".");
  return true;
}
var dernierEdit = 0;
/* On ne refait pas le globe entier à chaque coup de pioche : au sol on ne le
   voit pas, et il sera reconstruit en remontant. */
function refaireTerrain(i){
  var auSol = (VUE === "sol" || VUE === "descente");
  var dedans = auSol && patchCells && patchCells.indexOf(i) >= 0;
  if(dedans) globeSale = true;
  else { construireGlobe(M.glob); globeSale = false; }
  if(auSol){
    construirePatch(SOL_CELL, M.glob);
    semerProps(M.glob);
    detaillerObjets(true);
    calculerPlafond(SOL_CELL);
  }
  replacerObjets(); poserDecors(); poserBetes();
  surligner(i);
}
function rafraichirGlobe(){
  if(!globeSale) return;
  globeSale = false;
  construireGlobe(M.glob); replacerObjets(); poserDecors();
}

/* ═══════════════ viser au sol ═══════════════ */
function viserSol(cx, cy2){
  if(!patch) return;
  var r = renderer.domElement.getBoundingClientRect();
  souris.x = ((cx - r.left) / r.width) * 2 - 1;
  souris.y = -((cy2 - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(souris, camera);
  var inv = new THREE.Matrix4().copy(monde.matrixWorld).invert();
  var hp = ray.intersectObject(patch, false);
  var loc = hp.length ? hp[0].point.clone().applyMatrix4(inv) : null;
  var i = loc ? cellDe(loc) : -1;
  if(i >= 0 && patchCells.indexOf(i) < 0) i = -1;

  /* 0 · un outil de terrain est en main : il passe avant tout le reste. Hors
     du diorama on retombe sur le globe, pour pouvoir retoucher une case qu'on
     voit au loin sans avoir à s'en approcher. */
  if(outil){
    var j = i;
    if(j < 0 && planete){
      var hg = ray.intersectObject(planete, false);
      if(hg.length) j = cellDe(hg[0].point.clone().applyMatrix4(inv));
    }
    if(j < 0){ dire("Vise une case du sol."); return; }
    surligner(j); appliquerOutil(j); return;
  }

  /* 1 · quelque chose est en main et on a demandé à le déplacer */
  if(armeDeplacer && selSol && i >= 0){
    var ad = angleDist(i, loc), u = selSol.userData;
    if(u.type === "obj"){
      if(i !== u.cell){ dire("Un objet de cette taille reste sur sa case.", { dep:1, tou:1, sup:1 }); return; }
      var q0 = M.pos[i] || {};
      M.pos[i] = { a:ad.a, d:Math.min(.52, ad.d), r:q0.r || 0 };
      sauver(); placerObjet(i, selSol);
    } else if(u.type === "bete"){
      var B2 = M.betes[u.cell]; if(!B2 || !B2[u.idx]){ selSol = null; return; }
      var qb = B2[u.idx];
      if(defBete(qb.k).bio.indexOf(bioDe(i)) < 0){
        dire("Il ne vivrait pas là.", { dep:1, tou:1, sup:1 }); return;
      }
      qb.a = ad.a; qb.d = Math.min(.52, ad.d);
      if(i !== u.cell){
        B2.splice(u.idx, 1);
        if(!B2.length) delete M.betes[u.cell];
        if(!M.betes[i]) M.betes[i] = [];
        M.betes[i].push(qb);
        sauver(); poserBetes(); selSol = null; armeDeplacer = false;
        surligner(i); dire("Déménagé."); return;
      }
      sauver(); reveiller(selSol, qb);
      armeDeplacer = false; surligner(i); montrerSel(); return;
    } else {
      var L = M.decors[u.cell]; if(!L || !L[u.idx]){ selSol = null; return; }
      var q = L[u.idx];
      q.a = ad.a; q.d = Math.min(.64, ad.d);
      if(i !== u.cell){
        L.splice(u.idx, 1);
        if(!L.length) delete M.decors[u.cell];
        if(!M.decors[i]) M.decors[i] = [];
        M.decors[i].push(q);
        sauver(); poserDecors(); selSol = null; armeDeplacer = false;
        surligner(i); dire("Déplacé."); return;
      }
      sauver(); placerLibre(i, selSol, q);
    }
    armeDeplacer = false; surligner(i); montrerSel(); return;
  }

  /* 2 · on touche ce qui est posé : on le prend en main */
  if(!selDec && !selBete){
    var cibles = decorsG.concat(betesG.filter(function(g){
      return patchCells.indexOf(g.userData.cell) >= 0; }));
    Object.keys(objets).forEach(function(k){
      if(patchCells.indexOf(parseInt(k, 10)) >= 0) cibles.push(objets[k]);
    });
    var ho = cibles.length ? ray.intersectObjects(cibles, true) : [];
    if(ho.length){
      var g = ho[0].object;
      while(g && !g.userData.type) g = g.parent;
      if(g){
        selSol = g; armeDeplacer = false;
        surligner(g.userData.cell); montrerSel(); return;
      }
    }
  }

  /* 3 · le sol nu */
  if(i < 0){ selSol = null; surligner(-1); dire(""); return; }
  surligner(i);
  if(selBete){ poserBete(i, selBete, angleDist(i, loc)); return; }
  if(selDec){ poserDecor(i, selDec, angleDist(i, loc)); return; }
  selSol = null;
  dire("Une case de " + NOM_BIOME[bioDe(i)]
    + ". Choisis un décor dans l'atelier, ou touche ce qui est posé pour le déplacer.");
}

/* ═══════════════ la caméra ═══════════════ */
function camOrbite(){
  return { p:new THREE.Vector3(
      cam.cible.x + cam.r * Math.sin(cam.ph) * Math.sin(cam.th),
      cam.cible.y + cam.r * Math.cos(cam.ph),
      cam.cible.z + cam.r * Math.sin(cam.ph) * Math.cos(cam.th)),
    c:cam.cible.clone() };
}
/* le trièdre local : la verticale, le cap, et la droite du cap */
function baseSol(){
  var up = solPos.normalize();
  var av = solAv.sub(up.clone().multiplyScalar(solAv.dot(up)));
  if(av.lengthSq() < 1e-8){
    av.copy(Math.abs(up.y) < .9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0));
    av.sub(up.clone().multiplyScalar(av.dot(up)));
  }
  av.normalize();
  return { up:up.clone(), av:av.clone(),
           dr:new THREE.Vector3().crossVectors(av, up).normalize() };
}
/* Se déplacer, c'est faire tourner le point visé autour du centre de la planète.
   L'échelle vient de la distance : un pixel tiré vaut ce qu'il couvre de sol,
   de sorte que le terrain suit vraiment le doigt. */
function avancer(dx, dy){
  var b = baseSol();
  var h = renderer.domElement.clientHeight || 700;
  var k = 2 * solCam.r * Math.tan(camera.fov * Math.PI / 360) / h;
  var dep = b.dr.clone().multiplyScalar(-dx * k).add(b.av.clone().multiplyScalar(dy * k));
  solPos.add(dep.divideScalar(R0)).normalize();
  /* transport parallèle : on reprojette cap et référence sur le nouveau plan */
  var up = solPos;
  solAv.sub(up.clone().multiplyScalar(solAv.dot(up))).normalize();
  solRef.sub(up.clone().multiplyScalar(solRef.dot(up))).normalize();
}
function pivoter(dx, dy){
  var b = baseSol();
  solAv.applyAxisAngle(b.up, -dx * .005).normalize();
  solCam.el = Math.max(.45, Math.min(1.36, solCam.el - dy * .0035));
}
/* l'altitude du sol change d'un bloc à l'autre : on la rejoint en douceur,
   sinon la caméra sauterait de deux unités à chaque bord de case */
function suivreSol(dt){
  var i = cellDe(solPos);
  var cible = hauteurCell(i, M.glob);
  solAlt += (cible - solAlt) * Math.min(1, dt * 4.5);
  if(i !== SOL_CELL) patchAttente = i;
  majPatch();
  /* Le globe sous le diorama porte encore l'ancien terrain. On le refait dès
     que la main s'arrête, sinon une case retouchée puis quittée réapparaîtrait
     comme avant une fois sortie du diorama. */
  if(globeSale && patchAttente < 0 && performance.now() - dernierEdit > 600) rafraichirGlobe();
}
var patchAttente = -1, patchQuand = 0;
function calculerPlafond(i){
  PLAFOND = 0;
  autourDe(i, RANGS + 1).forEach(function(v){
    PLAFOND = Math.max(PLAFOND, R0 + hauteurCell(v, M.glob));
  });
  PLAFOND += .62;
}
/* refaire le diorama coûte quelques dizaines de millisecondes : on l'espace
   pour qu'un déplacement rapide ne se transforme pas en saccade continue */
function majPatch(){
  if(patchAttente < 0) return;
  var t = performance.now();
  if(t - patchQuand < 110) return;
  patchQuand = t;
  var i = patchAttente; patchAttente = -1;
  if(i === SOL_CELL) return;
  SOL_CELL = i;
  construirePatch(i, M.glob);
  semerProps(M.glob);
  detaillerObjets(true);
  calculerPlafond(i);
  majBetesVives();
  if(selSol && patchCells.indexOf(selSol.userData.cell) < 0){
    selSol = null; armeDeplacer = false; surligner(-1); dire("");
  }
}
function camSol(){
  var b = baseSol();
  var e = R0 + solAlt + .40;
  /* Sur une planète de dix unités de rayon, une case voisine en relief est un
     mur de deux unités : une vue trop rasante enterrerait la caméra. On relève
     donc l'angle juste assez pour la faire passer au-dessus du plus haut
     sommet des environs. Repousser la caméra en l'éloignant du centre, comme
     on serait tenté de le faire, la ferait sortir de la planète par le côté et
     on verrait l'espace sous l'horizon. */
  var r = solCam.r, el = solCam.el;
  var s = (PLAFOND*PLAFOND - e*e - r*r) / (2 * e * r);
  if(s > -1 && s < 1){ var em = Math.asin(s); if(em > el) el = Math.min(1.45, em); }
  var centre = b.up.clone().multiplyScalar(e);
  var dir = b.up.clone().multiplyScalar(Math.sin(el))
    .sub(b.av.clone().multiplyScalar(Math.cos(el)));
  var mr = new THREE.Matrix4().extractRotation(monde.matrixWorld);
  var p = centre.clone().add(dir.multiplyScalar(r));
  /* la verticale du lieu, dans le repère du monde : c'est elle qui doit faire
     le haut de l'image, sinon la vue bascule à mesure qu'on change de latitude
     et se retrouve la tête en bas de l'autre côté de la planète */
  return { p:p.applyMatrix4(mr), c:centre.clone().applyMatrix4(mr),
           u:b.up.clone().applyMatrix4(mr) };
}
/* On interpole la direction et le rayon séparément : une interpolation droite
   de la position ferait passer la caméra à travers la planète. */
/* descendre sans viser : on tombe sur la case qui est sous la caméra */
function explorerCentre(){
  if(VUE !== "orbite") return;
  var loc = camera.position.clone().applyMatrix4(
    new THREE.Matrix4().copy(monde.matrixWorld).invert());
  descendre(cellDe(loc));
}
function majCam(dt){
  if(VUE === "sol") suivreSol(dt);
  var pres = .5, loin = 500;
  if(VUE !== "orbite"){ pres = .05; loin = 340; }
  if(camera.near !== pres){ camera.near = pres; camera.far = loin; camera.updateProjectionMatrix(); }
  if(VUE === "orbite"){
    var A0 = camOrbite();
    camera.up.set(0, 1, 0);
    camera.position.copy(A0.p); camera.lookAt(A0.c);
    return;
  }
  if(!TR){
    var S = camSol();
    camera.up.copy(S.u);
    camera.position.copy(S.p); camera.lookAt(S.c);
    return;
  }
  /* la descente se mesure à l'horloge et non aux images : sur un appareil lent
     elle est saccadée, jamais interminable */
  TR.t = Math.min(1, (performance.now() - TR.t0) / (TR.dur * 1000));
  var u = TR.sens > 0 ? TR.t : 1 - TR.t;
  var k = u * u * (3 - 2 * u);
  var A = camOrbite(), B = camSol();
  var ra = A.p.length(), rb = B.p.length();
  var dir = A.p.clone().normalize().lerp(B.p.clone().normalize(), k).normalize();
  camera.position.copy(dir.multiplyScalar(ra + (rb - ra) * k));
  /* la verticale bascule progressivement de l'axe du monde à celle du lieu */
  var hu = new THREE.Vector3(0, 1, 0).lerp(B.u, k);
  if(hu.lengthSq() < 1e-6) hu.copy(B.u);
  camera.up.copy(hu.normalize());
  camera.lookAt(new THREE.Vector3().lerpVectors(A.c, B.c, k));
  ambiance(k);
  if(TR.t >= 1){
    if(TR.sens > 0){
      TR = null; VUE = "sol"; majPanneau();
      dire("Te voilà au sol. Fais glisser pour survoler la planète, pince pour "
        + "t'approcher, deux doigts pour tourner la tête.");
    } else { TR = null; finRemontee(); }
  }
}

/* ═══════════════ entrer et sortir ═══════════════ */
function descendre(i){
  if(VUE !== "orbite" || i < 0) return;
  SOL_CELL = i;
  patchAttente = -1; patchQuand = performance.now();
  calculerPlafond(i);
  construirePatch(i, M.glob);
  semerProps(M.glob);
  detaillerObjets(true);
  majBetesVives();
  var r0 = repere(i);
  solPos.set(CELLS[i].c[0], CELLS[i].c[1], CELLS[i].c[2]).normalize();
  solAv.copy(r0.nord); solRef.copy(r0.nord);
  solAlt = hauteurCell(i, M.glob);
  solCam.el = .88; solCam.r = 4.4;
  renderer.shadowMap.enabled = true;
  soleil.castShadow = true;
  soleil.shadow.mapSize.set(1024, 1024);
  soleil.shadow.bias = -.0008;
  var sc = soleil.shadow.camera;
  sc.left = -4.6; sc.right = 4.6; sc.top = 4.6; sc.bottom = -4.6;
  sc.near = 6; sc.far = 48; sc.updateProjectionMatrix();
  VUE = "descente";
  TR = { t:0, t0:performance.now(), dur:2.8, sens:1 };
  selObj = null; selDec = null; selBete = null; selSol = null; armeDeplacer = false;
  surligner(-1); majPanneau();
  dire("On descend vers " + ART[bioDe(i)] + "…");
}
/* on remonte à la verticale de là où on est arrivé, pas de là d'où on est
   parti : sans cela, traverser la planète puis remonter ramènerait brutalement
   au point de départ */
function remonter(){
  if(VUE !== "sol") return;
  var d = solPos.clone().applyMatrix4(new THREE.Matrix4().extractRotation(monde.matrixWorld));
  cam.ph = Math.max(.22, Math.min(2.92, Math.acos(Math.max(-1, Math.min(1, d.y)))));
  cam.th = Math.atan2(d.x, d.z);
  VUE = "remontee";
  TR = { t:0, t0:performance.now(), dur:2.0, sens:-1 };
  selSol = null; selDec = null; selBete = null; armeDeplacer = false;
  surligner(-1); dire("On remonte…");
}
function finRemontee(){
  VUE = "orbite"; TR = null;
  outil = null; presse = null;
  detaillerObjets(false);
  retirerPatch(); semerRien(); majBetesVives();
  SOL_CELL = -1; patchAttente = -1;
  ambiance(0); soleilOrbite();
  renderer.shadowMap.enabled = false;
  soleil.castShadow = false;
  rafraichirGlobe();
  majPanneau(); dire("");

/* ═══════════════ l'atelier selon la vue ═══════════════ */
function majPanneau(){
  var bas = (VUE === "sol" || VUE === "descente");
  var bs = document.querySelectorAll(".onglets button");
  var T = bas ? [["sol","Décors"], ["terre","Terrain"], ["betes","Animaux"]]
              : [["terra","Planète"], ["poser","Poser"], ["terre","Terrain"],
                 ["betes","Animaux"]];
  for(var k = 0; k < bs.length; k++){
    if(k < T.length){ bs[k].hidden = false; bs[k].dataset.tab = T[k][0];
      bs[k].textContent = T[k][1]; }
    else bs[k].hidden = true;
  }
  var ok = T.some(function(t){ return t[0] === onglet; });
  if(!ok) onglet = T[0][0];
  for(var k2 = 0; k2 < bs.length; k2++)
    bs[k2].classList.toggle("on", !bs[k2].hidden && bs[k2].dataset.tab === onglet);
  $("bSol").hidden = !bas;
  $("bExplorer").hidden = bas;
  $("bRenommer").hidden = bas;
  remplirListe();
}

/* ═══════════════ matériaux mis en cache ═══════════════ */
var MATB = {};
function matC(h, r){
  var c = h + "_" + (r === undefined ? 9 : r);
  if(!MATB[c]) MATB[c] = mm(h, r === undefined ? .9 : r);
  return MATB[c];
}
function lueur(h, o2){
  return new THREE.MeshBasicMaterial({ color:C(h), transparent:true, opacity:o2,
    blending:THREE.AdditiveBlending, depthWrite:false, fog:false });
}

/* ═══════════════ trois archétypes ═══════════════
   Presque tout ce qui marche tient dans un corps, une tête, quatre pattes et
   une queue ; ce qui vole dans un corps et deux ailes ; ce qui nage dans un
   fuseau et une caudale. Le reste n'est que proportions — et ce sont les
   proportions, pas le nombre de polygones, qui font reconnaître une bête. */
function quadrupede(o){
  var g = new THREE.Group();
  var m = matC(o.c), m2 = matC(o.c2 || o.c);
  var L = o.L, H = o.H, W = o.W, hp = o.hp;
  var corps = bt(W, H, L, m); corps.position.y = hp + H*.5; g.add(corps);
  if(o.croupe){
    var cr = bt(W*1.04, H*1.12, L*.34, m);
    cr.position.set(0, hp + H*.52, -L*.30); g.add(cr);
  }
  /* cou et tête : c'est leur hauteur relative qui distingue un cerf d'un loup */
  var yc = hp + H*(o.cou === undefined ? .9 : o.cou);
  var zc = L*.42;
  if(o.cou !== 0){
    var co = bt(W*.44, H*(o.cou || .9), W*.44, m);
    co.position.set(0, hp + H*(.6 + (o.cou || .9)*.5), zc);
    co.rotation.x = -(o.pench || .25); g.add(co);
  }
  var tz = zc + L*(o.tz === undefined ? .16 : o.tz);
  var ty = hp + H*(o.ty === undefined ? 1.35 : o.ty);
  var tete = bt(W*.66, H*.62, L*.30, m); tete.position.set(0, ty, tz); g.add(tete);
  var mus = bt(W*.40, H*.34, L*.20, m2);
  mus.position.set(0, ty - H*.10, tz + L*.22); g.add(mus);
  if(o.oreilles){
    [-1, 1].forEach(function(s){
      var or = bt(W*.14, H*(o.oreilles), W*.10, m);
      or.position.set(s*W*.24, ty + H*(.30 + o.oreilles*.5), tz - L*.06);
      or.rotation.z = s*.28; g.add(or);
    });
  }
  var pattes = [];
  [[-1,1],[1,1],[-1,-1],[1,-1]].forEach(function(s){
    var pg = new THREE.Group();
    var pm = bt(W*.24, hp, W*.24, m2); pm.position.y = -hp*.5; pg.add(pm);
    pg.position.set(s[0]*W*.32, hp, s[1]*L*.31); g.add(pg); pattes.push(pg);
  });
  if(o.queue){
    var q = bt(W*.18, W*.18, L*o.queue, m2);
    q.position.set(0, hp + H*.85, -L*(.5 + o.queue*.45));
    q.rotation.x = .5; g.add(q);
  }
  g.userData.pattes = pattes;
  return g;
}
function bois(g, y, z, w, c){          /* ramure de cervidé */
  var m = matC(c);
  [-1, 1].forEach(function(s){
    var t = cy(.008, .012, w*1.7, m, 4);
    t.position.set(s*w*.4, y + w*.85, z); t.rotation.z = s*.36; g.add(t);
    for(var k = 0; k < 2; k++){
      var b = cy(.006, .008, w*.8, m, 4);
      b.position.set(s*(w*.4 + w*.33*(k+1)*.5), y + w*(.9 + k*.5), z);
      b.rotation.z = s*1.0; g.add(b);
    }
  });
}
function oiseau(o){
  var g = new THREE.Group();
  var m = matC(o.c), m2 = matC(o.c2 || o.c);
  var corps = new THREE.Mesh(new THREE.SphereGeometry(o.L*.5, 9, 6), m);
  corps.scale.set(.55, .55, 1); g.add(corps);
  var t = new THREE.Mesh(new THREE.SphereGeometry(o.L*.22, 8, 5), m);
  t.position.set(0, o.L*.10, o.L*.44); g.add(t);
  var be = cn(o.L*.08, o.L*.20, matC(o.bec || 0xE0A93C), 5);
  be.position.set(0, o.L*.08, o.L*.60); be.rotation.x = Math.PI/2; g.add(be);
  var ailes = [];
  [-1, 1].forEach(function(s){
    var ag = new THREE.Group();
    /* Une aile fuselée, pas une planche ni un bâton : un tronc de cône couché,
       large dans le sens de la corde et mince dans le sens de l'épaisseur. Le
       rétrécissement doit se faire sur la corde — pas sur la hauteur, sinon
       l'aile devient une tige. */
    var a = cy(o.L*.42, o.L*.62, o.env*.52, m2, 3);
    a.scale.set(1, 1, .22);
    a.rotation.z = s*Math.PI/2; a.rotation.y = -.16;
    a.position.set(s*o.env*.26, 0, 0); ag.add(a);
    var pl = cy(o.L*.16, o.L*.40, o.env*.26, m2, 3);
    pl.scale.set(1, 1, .20);
    pl.rotation.z = s*Math.PI/2; pl.rotation.y = -.48;
    pl.position.set(s*o.env*.62, 0, -o.L*.10); ag.add(pl);
    ag.rotation.z = -s*.14;          /* dièdre */
    g.add(ag); ailes.push(ag);
  });
  var qu = bt(o.L*.34, o.L*.05, o.L*.40, m2);
  qu.position.z = -o.L*.58; g.add(qu);
  g.userData.ailes = ailes;
  return g;
}
function poisson(o){
  var g = new THREE.Group();
  var m = matC(o.c, o.rug === undefined ? .45 : o.rug);
  var corps = new THREE.Mesh(new THREE.SphereGeometry(o.L*.5, 10, 7), m);
  corps.scale.set(o.ep || .42, o.ht || .58, 1); g.add(corps);
  var cg = new THREE.Group();
  var cau = cn(o.L*(o.cq || .22), o.L*.30, m, 4);
  cau.rotation.x = -Math.PI/2; cau.scale.set(.25, 1, 1);
  cau.position.z = -o.L*.15; cg.add(cau);
  /* la nageoire des cétacés est horizontale : c'est ce détail, plus que la
     taille, qui fait qu'on lit une baleine et non un gros poisson */
  if(o.flukes) cau.rotation.z = Math.PI/2;
  cg.position.z = -o.L*.46; g.add(cg);
  if(o.dorsale){
    var d = cn(o.L*.12, o.L*.22, m, 3);
    d.scale.set(.25, 1, 1); d.position.y = o.L*(o.ht || .58)*.5; g.add(d);
  }
  if(o.nageoires){
    [-1, 1].forEach(function(s){
      var n = cn(o.L*.10, o.L*.20, m, 3);
      n.scale.set(.22, 1, 1); n.rotation.z = s*1.25;
      n.position.set(s*o.L*(o.ep || .42)*.5, -o.L*.05, o.L*.10); g.add(n);
    });
  }
  g.userData.caudale = cg;
  return g;
}

    (M.betes[i] || []).forEach(function(q){ if(CREAT[q.k]) d += CREAT[q.k].prix; });

/* ═══════════════ poser, retirer ═══════════════ */
var betesG = [], betesVives = [], selBete = null;
function poserBetes(){
  betesG.forEach(function(g){ monde.remove(g); });
  betesG = [];
  Object.keys(M.betes).forEach(function(ks){
    var i = parseInt(ks, 10), L = M.betes[ks] || [];
    L.forEach(function(q, n){
      if(!defBete(q.k)) return;
      var g = faireBete(q.k);
      g.userData.cell = i; g.userData.idx = n; g.userData.type = "bete"; g.userData.k = q.k;
      reveiller(g, q);
      g.traverse(function(o){ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
      monde.add(g); betesG.push(g);

/* ═══════════════ où va la bête ═══════════════
   Elle ne reste plus dans sa case : elle a un domaine — sa case et les deux
   anneaux autour — et n'en sort pas. C'est délibéré. Un animal qui s'éloignerait
   sans limite cesserait d'être « celui que j'ai posé près du village », et le
   patient perdrait le lien entre son geste et ce qu'il voit. Deux anneaux, cela
   lui laisse de quoi vraiment voyager tout en restant chez lui — et cela tient
   dans le diorama, qui en couvre trois. */
function capVers(i, j){
  var rep = repere(i), q = new THREE.Vector3().fromArray(CELLS[j].c);
  var pr = q.clone().sub(rep.up.clone().multiplyScalar(q.dot(rep.up)));
  return Math.atan2(pr.dot(rep.nord), pr.dot(rep.est));
}
function ecartAngle(a, b){ return ((a - b + Math.PI*3) % (Math.PI*2)) - Math.PI; }
/* Orienter sans passer par les repères de case : ceux-ci changent d'une case à
   l'autre, et une bête qui traverse pivoterait d'un coup au passage. On donne
   directement la verticale et la direction du regard. */
function orienterVers(g, p, fwd){
  var n = p.clone().normalize();
  var f = fwd.clone().sub(n.clone().multiplyScalar(fwd.dot(n)));
  if(f.lengthSq() < 1e-9){ g.quaternion.setFromUnitVectors(UP, n); return; }
  f.normalize();
  var r = new THREE.Vector3().crossVectors(n, f);
  g.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(r, n, f));
  fwd.copy(f);
}
function reveiller(g, q){
  var u = g.userData, d = defBete(q.k);
  u.a0 = q.a || 0; u.d0 = q.d || 0;
  u.cv = u.cell; u.a = u.a0; u.d = u.d0;
  u.graine = u.cell * 131 + u.idx * 17 + 3; u.n = 1;
  u.marche = 0; u.pause = 0; u.cross = null; u.migre = -1;
  u.vol = d.vol; u.nage = d.nage; u.saut = d.saut;
  u.flotte = d.flotte; u.saute = d.saute;
  u.haut = d.haut || .45;            /* hauteur de flottaison */
  u.plonge = d.plonge || 0;          /* de combien le corps s'enfonce */
  u.vitesse = d.v || (u.vol ? .38 : (u.nage ? .17 : .13));
  /* le domaine : les cases habitables à deux pas de la maison */
  u.zone = autourDe(u.cell, 2).filter(function(v){ return d.bio.indexOf(bioDe(v)) >= 0; });
  if(u.zone.indexOf(u.cell) < 0) u.zone.push(u.cell);
  var rep = repere(u.cell), r0 = q.r || 0;
  u.fwd = rep.est.clone().multiplyScalar(Math.cos(r0))
    .add(rep.nord.clone().multiplyScalar(Math.sin(r0)));
  choisirBut(g);
  placerBete(g);
}
function choisirBut(g){
  var u = g.userData;
  u.pause = 0;
  var vois = (VOISINS && VOISINS[u.cv] ? VOISINS[u.cv] : []).filter(function(v){
    return u.zone.indexOf(v) >= 0;
  });
  /* une fois sur trois, on va voir à côté */
  if(vois.length && alea(u.graine + u.n) < (u.vol || u.nage ? .55 : .36)){
    u.migre = vois[Math.floor(alea(u.graine + u.n*3) * vois.length) % vois.length];
    u.ca = capVers(u.cv, u.migre); u.cd = .90;
  } else {
    u.migre = -1;
    u.ca = alea(u.graine + u.n*5) * 6.28319;
    u.cd = .05 + alea(u.graine + u.n*7) * .48;
  }
  u.n++;
}
/* Le passage d'une case à l'autre. Quand il y a une marche, la bête la franchit
   d'un bond : c'est le seul moment où son déplacement se voit vraiment, et
   c'est pour cela qu'il ne faut surtout pas l'escamoter. */
var NSAUTS = 0;
function lancerSaut(g){
  NSAUTS++;
  var u = g.userData, B = u.migre;
  var de = g.position.clone();
  var aB = capVers(B, u.cv);
  var vers = pointCell(B, aB, .90, M.glob);
  if(u.plonge) vers.addScaledVector(vers.clone().normalize(), -u.plonge);
  var dh = Math.abs(vers.length() - de.length());
  /* même à plat le passage se voit : la bête enjambe la limite. Ce petit saut
     est ce qui distingue « elle a changé de case » de « elle a glissé ». */
  u.cross = { t:0, dur:(u.vol || u.nage || u.flotte) ? .9 + dh : .46 + dh * .42,
              de:de, vers:vers, dh:dh,
              h:(u.vol || u.nage || u.flotte) ? 0 : (.085 + dh * .55),
              cell:B, a:aB };
  u.migre = -1;
}
function placerBete(g){
  var u = g.userData;
  var p = pointCell(u.cv, u.a, u.d, M.glob);
  var n = p.clone().normalize();
  if(u.vol) p.addScaledVector(n, .85 + .25 * Math.sin(u.marche * .7));
  else if(u.flotte) p.addScaledVector(n, u.haut + .08 * Math.sin(u.marche * 1.6));
  else if(u.plonge) p.addScaledVector(n, -u.plonge);
  g.position.copy(p);
  orienterVers(g, p, u.fwd);
}
function majBetesVives(){
  var avant = betesVives;
  betesVives = (patchCells && patchCells.length)
    ? betesG.filter(function(g){ return patchCells.indexOf(g.userData.cell) >= 0; })
    : [];
  /* une bête qu'on cesse d'animer en plein saut resterait suspendue en l'air :
     on la fait atterrir tout de suite */
  avant.forEach(function(g){
    var u = g.userData;
    if(u.cross && betesVives.indexOf(g) < 0){
      u.cv = u.cross.cell; u.a = u.cross.a; u.d = .90; u.cross = null;
      choisirBut(g); placerBete(g);
    }
  });
}
function betesOuvertes(){
  return ORDRE_B.filter(function(k){
    var o = BETES_L[k]; return !o.req || !!M.glob[o.req];
  });
}
function creaturesOuvertes(){ return ORDRE_C.slice(); }
function choisirBete(k){
  var o = defBete(k), cre = estCreature(k);
  if(selBete === k){ selBete = null; remplirListe(); dire(""); return; }
  var s = cre ? soldeGra() : solde();
  if(o.prix > s){
    dire("Il manque " + (o.prix - s) + (cre ? " éclat" : " cristal")
      + ((o.prix - s) > 1 ? "s" : "") + " pour " + o.nom.toLowerCase() + ".");
    return;
  }
  selBete = k; selObj = null; selDec = null; outil = null; selSol = null;
  remplirListe();
  dire("Touche " + (cre ? "une case" : "une case de "
    + o.bio.map(function(b){ return NOM_BIOME[b]; }).join(" ou de ")) + " pour l'y installer.");
}
function poserBete(i, k, ad){
  var o = defBete(k), cre = estCreature(k);
  if(o.bio.indexOf(bioDe(i)) < 0){
    dire("Il ne vivrait pas sur " + ART[bioDe(i)] + " — il lui faut "
      + o.bio.map(function(b){ return ART[b]; }).join(", ") + ".");
    return;
  }
  var s = cre ? soldeGra() : solde();
  if(o.prix > s){ dire("Il manque " + (o.prix - s) + (cre ? " éclats." : " cristaux.")); return; }
  if(!M.betes[i]) M.betes[i] = [];
  if(M.betes[i].length >= 4){ dire("Il y a déjà du monde sur cette case."); return; }
  M.betes[i].push({ k:k, a:ad.a, d:Math.min(.52, ad.d),
    r: alea(i*17 + M.betes[i].length) * 6.28319 });
  sauver(); poserBetes(); majSolde(); remplirListe();
  dire(o.nom + " s'installe" + (cre ? "" : " sur " + ART[bioDe(i)]) + ".");
}
function retirerBete(g){
  var u = g.userData, L = M.betes[u.cell];
  if(!L) return;
  L.splice(u.idx, 1);
  if(!L.length) delete M.betes[u.cell];
  selSol = null; armeDeplacer = false;
  sauver(); poserBetes(); majSolde(); remplirListe();
  dire("Il est reparti, les cristaux sont revenus.");
}

/* ═══════════════ ça bouge ═══════════════
   Une bête choisit un but — dans sa case ou chez la voisine — s'y rend à
   vitesse constante, s'arrête parfois, franchit les marches d'un bond. Rien de
   plus : c'est la lenteur, les pauses et le bond qui font croire au vivant,
   bien plus que la complexité du trajet. */
function animerBetes(dt){
  for(var n = 0; n < betesVives.length; n++){
    var g = betesVives[n], u = g.userData;

    /* ── la traversée ── */
    if(u.cross){
      var cr = u.cross;
      if(!cr.t) g.scale.set(1, 1, 1);
      cr.t += dt;
      var q = Math.min(1, cr.t / cr.dur), e = q*q*(3 - 2*q);
      var p = cr.de.clone().lerp(cr.vers, e);
      var nn = p.clone().normalize();
      var arc = 4 * cr.h * q * (1 - q);
      p.addScaledVector(nn, arc);
      g.position.copy(p);
      u.fwd.copy(cr.vers).sub(cr.de);
      orienterVers(g, p, u.fwd);
      if(cr.h > .01){
        /* elle pique du nez en retombant, et tend les pattes en l'air */
        g.rotateX(-cr.h * 1.1 * (1 - 2*q));
        if(u.pattes) for(var j0 = 0; j0 < u.pattes.length; j0++)
          u.pattes[j0].rotation.x = (j0 < 2 ? -.55 : .55) * (1 - Math.abs(1 - 2*q));
      }
      if(u.ailes) for(var w0 = 0; w0 < u.ailes.length; w0++)
        u.ailes[w0].rotation.z = (w0 % 2 ? 1 : -1) * (.22 + .40 * Math.sin(cr.t * 9));
      u.marche += dt * 4;
      if(q >= 1){
        u.cv = cr.cell; u.a = cr.a; u.d = .90; u.cross = null;
        choisirBut(g);
      }
      continue;
    }

    /* ── le vol : un cercle patient, qui se déplace quand l'oiseau change de case ── */
    if(u.vol){
      u.marche += dt * u.vitesse * 2.4;
      u.a += dt * u.vitesse * 1.5;
      u.d = Math.max(.12, Math.min(.62, u.d + (( .40 ) - u.d) * dt));
      placerBete(g);
      var tang = new THREE.Vector3().crossVectors(g.position.clone().normalize(), u.fwd);
      g.rotateZ(.34 * Math.sin(u.marche * .5 + 1));
      if(u.ailes) for(var w = 0; w < u.ailes.length; w++)
        u.ailes[w].rotation.z = (w % 2 ? 1 : -1) * (.22 + .34 * Math.sin(u.marche * 2.4 + w));
      u.t = (u.t || 0) + dt;
      if(u.t > 9){ u.t = 0; u.migre = -1; choisirBut(g); if(u.migre >= 0) lancerSaut(g); }
      continue;
    }

    /* ── marche, nage, dérive ── */
    var avant = g.position.clone();
    if(u.pause > 0){
      u.pause -= dt;
      if(u.pause <= 0) choisirBut(g);
      if(u.pattes) for(var j1 = 0; j1 < u.pattes.length; j1++)
        u.pattes[j1].rotation.x *= .90;
      if(u.flotte || u.nage){ u.marche += dt * .8; placerBete(g); }
      continue;
    }
    var da = ecartAngle(u.ca, u.a), dd = u.cd - u.d;
    var rayon = Math.max(.12, u.d) * RCELL;
    var dm = Math.sqrt(da*da*rayon*rayon + dd*dd*RCELL*RCELL);
    var pas = dm > 1e-5 ? (u.vitesse * dt) / dm : 1;
    if(pas >= 1){
      u.a = u.ca; u.d = u.cd;
      placerBete(g);
      if(u.migre >= 0) lancerSaut(g);
      else { u.pause = 1.5 + alea(u.graine + u.n*11) * 5; u.n++; }
    } else {
      u.a += da * pas; u.d += dd * pas;
      u.marche += dt * (u.saute ? 3.4 : 6.2);
      placerBete(g);
    }

    /* le regard suit le déplacement réel, lissé : une bête ne pivote pas sur place */
    var dv = g.position.clone().sub(avant);
    if(dv.lengthSq() > 1e-9){
      u.fwd.lerp(dv.normalize(), Math.min(1, dt * 3.2));
      orienterVers(g, g.position, u.fwd);
    }

    if(u.saute){
      /* ce qui avance par bonds : lapin, marmotte, ploc */
      var h = Math.abs(Math.sin(u.marche * 1.9)) * .12;
      g.position.addScaledVector(g.position.clone().normalize(), h);
      g.scale.set(1 + h*.6, 1 - h*.7, 1 + h*.6);
      continue;
    }
    if(u.nage){
      if(g.userData.caudale) g.userData.caudale.rotation.y = .32 * Math.sin(u.marche * 1.1);
      if(u.saut){
        var ph = (u.marche * .22) % 6.28319;
        if(ph < 2.2){
          var s2 = Math.sin(ph / 2.2 * Math.PI);
          g.position.addScaledVector(g.position.clone().normalize(), s2 * .30);
          g.rotateX(-Math.cos(ph / 2.2 * Math.PI) * .6);
        }
      }
      continue;
    }
    if(u.pattes){
      for(var j = 0; j < u.pattes.length; j++)
        /* l'allure diagonale, et le décompte reprend à chaque bête d'un
           troupeau : sans le modulo, douze pattes marcheraient en vrac */
        u.pattes[j].rotation.x = .30 * Math.sin(u.marche * 1.3
          + (j % 2 ? 0 : Math.PI) + ((j % 4) < 2 ? 0 : Math.PI));
    }
    if(u.fils){
      for(var f = 0; f < u.fils.length; f++)
        u.fils[f].rotation.x = .25 * Math.sin(u.marche * 1.4 + f);
    }
  }
}

/* ═══════════════ encodage compact ═══════════════
   Chaque nombre en base 36, chaque section séparée par un point. Le JSON brut
   d'une planète bien remplie fait une dizaine de milliers de caractères ; cette
   forme-ci en fait deux mille, ce qui est la différence entre un courriel
   utilisable et un courriel qu'on renonce à envoyer. */
var B36 = function(n){ return Math.round(n).toString(36); };
var D36 = function(t){ return parseInt(t, 36) || 0; };
var SOLS_C = ["ocean","banquise","plage","plaine","desert","toundra","montagne","neige"];

function encAngle(a){ return B36(Math.round(((a % 6.28319) + 6.28319) % 6.28319 * 100)); }
function decAngle(t){ return D36(t) / 100; }

function texteDe(M2){
  function liste(obj, ordre, avecPos){
    var out = [];
    Object.keys(obj || {}).forEach(function(ks){
      var L = obj[ks];
      if(!L.forEach) L = [L];
      L.forEach(function(q){
        var k = ordre.indexOf(q.k === undefined ? q : q.k);
        if(k < 0) return;
        out.push(avecPos
          ? [B36(ks), B36(k), encAngle(q.a || 0), B36((q.d || 0) * 100),
             encAngle(q.r || 0)].join("-")
          : [B36(ks), B36(k)].join("-"));
      });
    });
    return out.join("_");
  }
  var bits = 0;
  TERRA.forEach(function(t, i){ if(M2.glob[t.id]) bits |= (1 << i); });
  var cells = [];
  Object.keys(M2.cells || {}).forEach(function(i){
    var k = ORDRE_OBJ.indexOf(M2.cells[i]);
    if(k >= 0) cells.push(B36(i) + "-" + B36(k));
  });
  var pos = [];
  Object.keys(M2.pos || {}).forEach(function(i){
    var q = M2.pos[i];
    pos.push([B36(i), encAngle(q.a || 0), B36((q.d || 0) * 100), encAngle(q.r || 0)].join("-"));
  });
  var terre = [];
  Object.keys(M2.terre || {}).forEach(function(i){
    var t = M2.terre[i];
    terre.push([B36(i), t.b ? B36(SOLS_C.indexOf(t.b)) : "z",
      B36((t.h || 0) + 4)].join("-"));
  });
  var parts = [
    "MP1",
    encodeURIComponent(M2.nom || "").replace(/\./g, "%2E"),
    B36(M2.graine || 0),
    B36(M2.niv || 3),
    B36(bits),
    cells.join("_"),
    pos.join("_"),
    liste(M2.decors, ORDRE_DEC, 1),
    liste(M2.betes, ORDRE_B.concat(ORDRE_C), 1),
    terre.join("_"),
    B36(M2.gag || 0)
  ];
  var corps = parts.join(".");
  /* une somme de contrôle : un bloc tronqué par un logiciel de messagerie est
     refusé au lieu de produire une planète à moitié juste */
  var som = 0;
  for(var i = 0; i < corps.length; i++) som = (som * 31 + corps.charCodeAt(i)) % 1679615;
  return corps + "." + B36(som);
}

function lireTexte(txt){
  var t = (txt || "").replace(/\s+/g, "");
  if(t.indexOf("MP1.") !== 0) return null;
  var i = t.lastIndexOf(".");
  if(i < 0) return null;
  var corps = t.slice(0, i), som = t.slice(i + 1), s2 = 0;
  for(var k = 0; k < corps.length; k++) s2 = (s2 * 31 + corps.charCodeAt(k)) % 1679615;
  if(B36(s2) !== som) return null;
  var p = corps.split(".");
  if(p.length < 10) return null;
  var M2 = { nom:decodeURIComponent(p[1] || "") || "Ma planète",
    graine:D36(p[2]), niv:Math.max(3, Math.min(5, D36(p[3]) || 3)),
    glob:{}, cells:{}, pos:{}, decors:{}, betes:{}, terre:{} };
  var bits = D36(p[4]);
  TERRA.forEach(function(x, n){ if(bits & (1 << n)) M2.glob[x.id] = 1; });
  (p[5] ? p[5].split("_") : []).forEach(function(e){
    var f = e.split("-"); var o = ORDRE_OBJ[D36(f[1])];
    if(o) M2.cells[D36(f[0])] = o;
  });
  (p[6] ? p[6].split("_") : []).forEach(function(e){
    var f = e.split("-");
    M2.pos[D36(f[0])] = { a:decAngle(f[1]), d:D36(f[2])/100, r:decAngle(f[3]) };
  });
  function relire(txt2, ordre, cible){
    (txt2 ? txt2.split("_") : []).forEach(function(e){
      var f = e.split("-"), k = ordre[D36(f[1])];
      if(!k) return;
      var i2 = D36(f[0]);
      (cible[i2] = cible[i2] || []).push({ k:k, a:decAngle(f[2]),
        d:D36(f[3])/100, r:decAngle(f[4]) });
    });
  }
  relire(p[7], ORDRE_DEC, M2.decors);
  relire(p[8], ORDRE_B.concat(ORDRE_C), M2.betes);
  (p[9] ? p[9].split("_") : []).forEach(function(e){
    var f = e.split("-"), o = {};
    if(f[1] !== "z") o.b = SOLS_C[D36(f[1])];
    var h = D36(f[2]) - 4;
    if(h) o.h = h;
    if(o.b || o.h) M2.terre[D36(f[0])] = o;
  });
  M2.gag = D36(p[10] || "0");
  return M2;
}

/* ═══════════════ changer de code, sauver, reprendre ═══════════════ */
function chargerCode(c){
  c = (c || "").replace(/[^A-Za-z0-9 _-]/g, "").trim().slice(0, 24) || "essai";
  CODE = c; CODE_LOG = c;
  try{ localStorage.setItem(K_CODE, CODE); }catch(e){}
  adopter(lireTout()[CODE] || { nom:"Ma planète", graine: hash(CODE) % 100000,
    niv:3, glob:{}, cells:{}, pos:{}, decors:{}, betes:{}, terre:{} });
  if($("pCode")) $("pCode").textContent = CODE;
}
/* Remplacer la planète courante par une autre, et tout reconstruire. Un seul
   chemin, qu'on arrive par un code ou par un bloc de sauvegarde. */
function adopter(M2){
  M = M2;
  if(!M.pos) M.pos = {}; if(!M.decors) M.decors = {};
  if(!M.terre) M.terre = {}; if(!M.betes) M.betes = {};
  if(!M.niv) M.niv = 3;
  GRAINE = M.graine;
  if(VUE !== "orbite"){ retirerPatch(); semerRien(); VUE = "orbite"; TR = null;
    SOL_CELL = -1; renderer.shadowMap.enabled = false; soleil.castShadow = false;
    soleilOrbite(); ambiance(0); }
  Object.keys(objets).forEach(function(i){ monde.remove(objets[i]); });
  objets = {}; detailles = [];
  selObj = null; selDec = null; selBete = null; selSol = null; outil = null; presse = null;
  COINS3 = null; couleursSales = true;
  preparerMonde();
  construireGlobe(M.glob); majDecor();
  Object.keys(M.cells).forEach(function(i){ poser(parseInt(i, 10), M.cells[i], true); });
  poserDecors(); poserBetes();
  majSolde(); majPanneau(); dire("");
}
/* Effacer pour de bon : la ligne du patient disparaît du stockage, et l'écran
   repart sur une planète vierge. Rien n'est conservé ailleurs — c'est justement
   ce qu'on promet dans la note d'information. */
function effacerPlanete(){
  try{
    var t = lireTout();
    delete t[CODE];
    localStorage.setItem(K_MONDE, JSON.stringify(t));
  }catch(e){}
  adopter({ nom:"Ma planète", graine: hash(CODE) % 100000, niv:3,
    glob:{}, cells:{}, pos:{}, decors:{}, betes:{}, terre:{} });
  try{ if(window.parent && window.parent !== window && window.parent.ORBITE
        && window.parent.ORBITE.miroirMonde) window.parent.ORBITE.miroirMonde(); }catch(e){}
}
function annoncerSauvegarde(){
  var e = $("sauve");
  if(!e) return;
  e.classList.add("vu");
  clearTimeout(annoncerSauvegarde._t);
  annoncerSauvegarde._t = setTimeout(function(){ e.classList.remove("vu"); }, 1400);
}

  } else {

        + 'la végétation ouvre les arbres et les villages, l\'eau ouvre les plages, '

    } else {

        var px = prixObj(k);
        out += ligne((selObj === k ? "on " : "") + (px > s && selObj !== k ? "cher" : ""),

  }
  L.innerHTML = out;
  var bs = L.querySelectorAll(".art");
  Array.prototype.forEach.call(bs, function(b, i){
    b.addEventListener("click", function(){
      if(onglet === "terra") acheterTerra(TERRA[i]);

  dire("Touche une case de " + o.bio.map(function(b){ return NOM_BIOME[b]; }).join(" ou de ")

function surligner(i){

     monter d'autant, sinon il disparaît sous le terrain */
  var e = R0 + hauteurCell(i, M.glob) + (VUE === "orbite" ? .06 : .14);
  cel.coins.forEach(function(q){ pts.push(new THREE.Vector3(q[0]*e, q[1]*e, q[2]*e)); });
  contour.geometry.dispose();
  contour.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  contour.visible = true;
}
function viser(cx, cy){
  if(VUE !== "orbite"){ if(VUE === "sol") viserSol(cx, cy); return; }
  var r = renderer.domElement.getBoundingClientRect();
  souris.x = ((cx - r.left) / r.width) * 2 - 1;
  souris.y = -((cy - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(souris, camera);
  var h = ray.intersectObject(planete, false);
  if(!h.length){ surligner(-1); return; }
  var i = cellDe(h[0].point.clone().applyMatrix4(
    new THREE.Matrix4().copy(monde.matrixWorld).invert()));
  surligner(i);
  if(outil){ appliquerOutil(i); return; }
  if(selBete){ poserBete(i, selBete, { a:alea(i*3)*6.28319, d:.10 + alea(i*5)*.30 }); return; }
  var d = { b:bioDe(i) }, nom = NOM_BIOME[d.b];
  if(M.cells[i]){
    dire(OBJETS[M.cells[i]].nom + " sur " + ART[d.b] + ".", { exp:i, ret:i });
    return;
  }
  if(!selObj){ dire("Une case de " + nom + ".", { exp:i }); return; }
  var o = OBJETS[selObj];
  if(o.bio.indexOf(d.b) < 0){
    dire("Ça ne va pas sur " + ART[d.b] + " — il faut " + o.bio.map(function(b){
      return ART[b]; }).join(" ou ") + ".");
    return;
  }
  var px = prixObj(selObj);
  if(px > solde()){ dire("Il manque " + (px - solde()) + " cristaux."); return; }
  poser(i, selObj);
  majSolde();
  if(px > solde()){ selObj = null;
    dire("C'est posé. Il faudra revenir jouer pour en poser d'autres.", { exp:i }); }
  else dire("C'est posé. Tu peux continuer, ou descendre le voir de près.", { exp:i });
  remplirListe();
}

/* ═══════════════ rotation, zoom, boutons ═══════════════ */
var drag = false, bouge = false, lx = 0, ly = 0, ptrs = {}, dPinch = 0;
var cPinch = null, pivot = false;
function brancher(){
  var el = renderer.domElement;
  el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  el.addEventListener("pointerdown", function(e){
    ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
    if(Object.keys(ptrs).length === 1){
      drag = true; bouge = false; lx = e.clientX; ly = e.clientY;
      /* au sol, le glissement déplace ; le bouton droit ou Maj fait tourner
         la tête sur place */
      pivot = (e.button === 2 || e.shiftKey);
      $("scene").classList.add("drag");
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
    } else { drag = false; dPinch = 0; cPinch = null; }
  });
  el.addEventListener("pointermove", function(e){
    if(ptrs[e.pointerId]) ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
    if(VUE === "descente" || VUE === "remontee") return;
    var sol = (VUE === "sol");
    var ks = Object.keys(ptrs);
    if(ks.length >= 2){
      var a = ptrs[ks[0]], b = ptrs[ks[1]];
      var d = Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y));
      var mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
      if(dPinch){
        if(sol) solCam.r = Math.max(2.0, Math.min(11, solCam.r - (d - dPinch) * .018));
        else cam.r = Math.max(R_FIT*.42, Math.min(R_FIT*1.5, cam.r - (d - dPinch) * .07));
      }
      /* deux doigts qui glissent ensemble : on tourne la tête */
      if(sol && cPinch) pivoter(mx - cPinch.x, my - cPinch.y);
      dPinch = d; cPinch = { x:mx, y:my }; bouge = true; return;
    }
    if(!drag) return;
    var dx = e.clientX - lx, dy = e.clientY - ly;
    if(Math.abs(dx) + Math.abs(dy) > 9) bouge = true;
    if(sol){
      if(pivot) pivoter(dx, dy);
      else avancer(dx, dy);
    } else {
      cam.th -= dx * .006;
      cam.ph = Math.max(.22, Math.min(2.92, cam.ph - dy * .006));
    }
    lx = e.clientX; ly = e.clientY;
  });
  function fin(e){
    delete ptrs[e.pointerId];
    if(Object.keys(ptrs).length === 0){
      if(drag && !bouge && !pivot) viser(e.clientX, e.clientY);
      drag = false; pivot = false; dPinch = 0; cPinch = null;
      $("scene").classList.remove("drag");
    }
  }
  el.addEventListener("pointerup", fin);
  el.addEventListener("pointercancel", fin);
  el.addEventListener("wheel", function(e){
    e.preventDefault();
    if(VUE === "sol"){
      solCam.r = Math.max(2.0, Math.min(11, solCam.r + (e.deltaY > 0 ? .4 : -.4)));
      return;
    }
    if(VUE !== "orbite") return;
    cam.r = Math.max(R_FIT*.42, Math.min(R_FIT*1.5, cam.r + (e.deltaY > 0 ? R_FIT*.05 : -R_FIT*.05)));
  }, { passive:false });

  Array.prototype.forEach.call(document.querySelectorAll(".onglets button"), function(b){
    b.addEventListener("click", function(){
      onglet = b.dataset.tab; selObj = null; selDec = null; selBete = null;
      outil = null; presse = null;
      Array.prototype.forEach.call(document.querySelectorAll(".onglets button"), function(x){
        x.classList.toggle("on", x === b); });
      remplirListe();
    });
  });
  $("bSol").addEventListener("click", function(){ remonter(); });
  $("bExplorer").addEventListener("click", function(){ explorerCentre(); });
  $("bSauve").addEventListener("click", boiteSauve);
  $("voile").addEventListener("click", function(e){ if(e.target === $("voile")) fermerBoite(); });
  if(BAC) brancherBac();
  $("bOuvrir").addEventListener("click", function(){
    $("pan").classList.remove("ferme");
    $("bandeau").classList.remove("large"); $("barre").classList.remove("large");
  });
  $("bFermer").addEventListener("click", function(){
    $("pan").classList.add("ferme");
    $("bandeau").classList.add("large"); $("barre").classList.add("large");
  });
  /* sur téléphone la feuille du bas mange la moitié de l'écran : on la laisse
     fermée au départ pour que la planète ait toute la place */
  if(window.innerWidth < 760){
    $("pan").classList.add("ferme");
    $("bandeau").classList.add("large"); $("barre").classList.add("large");
  }
  $("bRenommer").addEventListener("click", function(){
    var n = prompt("Comment s'appelle ta planète ?", M.nom);
    if(n === null) return;
    n = n.replace(/[<>]/g, "").trim().slice(0, 28);
    M.nom = n || "Ma planète"; sauver(); majSolde();
  });
  if(RETOUR){
    var b = $("bSortir"); b.hidden = false;
    b.addEventListener("click", function(){ RETOUR(); });
  }
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!$("voile").hidden){ fermerBoite(); return; }
    if(VUE === "sol"){
      if(selSol || selDec){ selSol = null; selDec = null; armeDeplacer = false;
        surligner(-1); remplirListe(); dire(""); }
      else remonter();
      return;
    }
    selObj = null; remplirListe(); dire("");
  });
}
/* ═══════════════ le bac à sable ═══════════════
   Deux boutons seulement, mais ce sont les deux qu'on veut quand on essaie :
   voir tout de suite ce que donne une planète achevée, et en tirer une autre
   au sort pour juger de la variété de ce que la graine produit. */
function brancherBac(){
  $("pBac").hidden = false; $("bTout").hidden = false; $("bNeuf").hidden = false;
  $("bFin").hidden = false;
  var majFin = function(){ $("bFin").textContent = "Finesse : " + CELLS.length; };
  majFin();
  /* Changer la finesse, c'est changer le numéro des cases : on repart donc
     d'un monde neuf. C'est pour cela que le réglage n'existe qu'ici. */
  $("bFin").addEventListener("click", function(){
    if(VUE !== "orbite"){ dire("Remonte d'abord en orbite."); return; }
    M.niv = (M.niv >= 5) ? 3 : M.niv + 1;
    M.glob = {}; M.cells = {}; M.pos = {}; M.decors = {}; M.terre = {}; M.betes = {};
    Object.keys(objets).forEach(function(i){ monde.remove(objets[i]); });
    objets = {}; selObj = null; selDec = null; selBete = null; outil = null; presse = null;
    sauver(); poserBetes();
    var t0 = performance.now();
    preparerMonde();
    var t1 = performance.now();
    construireGlobe(M.glob);
    var t2 = performance.now();
    majDecor(); poserDecors(); majSolde(); remplirListe(); majFin();
    dire(CELLS.length + " cases · grille " + Math.round(t1-t0) + " ms · globe "
      + Math.round(t2-t1) + " ms · " + (planete.geometry.index.count/3) + " triangles.");
  });
  $("bTout").addEventListener("click", function(){
    if(VUE !== "orbite"){ dire("Remonte d'abord en orbite."); return; }
    TERRA.forEach(function(t){ M.glob[t.id] = 1; });
    sauver(); construireGlobe(M.glob); majDecor(); replacerObjets();
    majSolde(); remplirListe();
    dire("Tout est débloqué : atmosphère, eau, végétation, relief, climat, nuages, lune, anneau.");
  });
  $("bNeuf").addEventListener("click", function(){
    if(VUE !== "orbite"){ dire("Remonte d'abord en orbite."); return; }
    M.graine = Math.floor(Math.random() * 100000); GRAINE = M.graine;
    COINS3 = null; couleursSales = true;
    M.glob = {}; M.cells = {}; M.pos = {}; M.decors = {}; M.terre = {}; M.betes = {};
    Object.keys(objets).forEach(function(i){ monde.remove(objets[i]); });
    objets = {}; selObj = null; selDec = null; selBete = null;
    sauver(); poserBetes();
    preparerMonde(); construireGlobe(M.glob); majDecor(); poserDecors();
    majSolde(); remplirListe();
    dire("Une planète toute neuve — graine " + M.graine + ".");
  });
}

/* La distance qui fait tenir la planète dans le cadre. En portrait c'est la
   largeur qui commande, et de loin : sans ce calcul, le globe déborde des deux
   côtés sur un téléphone. */
var R_FIT = 38, premierCadre = true;
function redim(){
  if(!renderer) return;
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  var etroit = w < 760;
  if(etroit) camera.setViewOffset(w, h, 0, h*.055, w, h);
  else camera.setViewOffset(w, h, w*.11, 0, w, h);
  var tv = Math.tan(camera.fov * Math.PI/360), besoin = 13.4;
  R_FIT = Math.max(besoin / tv, besoin / (tv * camera.aspect));
  if(premierCadre){ cam.r = R_FIT; premierCadre = false; }
  cam.r = Math.max(R_FIT * .42, Math.min(R_FIT * 1.5, cam.r));
  camera.updateProjectionMatrix();
}

/* ═══════════════ la boucle ═══════════════ */
var dernier = 0;
function boucle(tt){
  requestAnimationFrame(boucle);
  var dt = dernier ? Math.min(.05, (tt - dernier)/1000) : .016;
  /* le temps réel, pour ce qui doit avancer à l'horloge et non à l'image : sur
     un appareil lent, une bête qui marcherait au rythme des images resterait
     sur place au lieu d'être simplement saccadée */
  var dtr = dernier ? Math.min(.25, (tt - dernier)/1000) : .016;
  dernier = tt;
  /* hors de l'orbite la planète est figée : sans cela l'horizon dériverait
     sous les pieds du patient pendant qu'il aménage */
  if(VUE === "orbite" && !drag) monde.rotation.y += dt * .035;
  if(nuages) nuages.rotation.y += dt * .055;
  if(lune){
    var a = tt/9000;
    lune.position.set(Math.cos(a)*22, Math.sin(a*.7)*5, Math.sin(a)*22);
    lune.rotation.y = -a;
  }
  if(VUE !== "orbite"){ houle(dtr); animerBetes(dtr); }
  majCam(dt);
  renderer.render(scene, camera);
}

/* ═══════════════ départ ═══════════════ */
setTimeout(function(){

      M.niv = n; M.glob = {}; M.cells = {}; M.pos = {}; M.decors = {}; M.terre = {};
      M.betes = {}; poserBetes();

      sauver();

      return { cases:CELLS.length, grille:+(t1-t0).toFixed(1), globe:+(t2-t1).toFixed(1),
        tris:planete.geometry.index.count/3, rcell:+RCELL.toFixed(3), nsub:NSUB, rangs:RANGS }; },
    chrono:function(){ var t0 = performance.now(); construireGlobe(M.glob);
      var t1 = performance.now();
      var d = patchCells ? patchCells.length : 0;
      return { globe:+(t1-t0).toFixed(1), patchCells:d }; },
    chronoPatch:function(){ var t0 = performance.now();
      construirePatch(cellDe(solPos), M.glob); semerProps(M.glob);
      return { ms:+(performance.now()-t0).toFixed(1), cases:patchCells.length,
        tris:patch.geometry.index.count/3 }; },
    outil:function(k){ outil = k; }, appliquer:function(i){ return appliquerOutil(i); },
    decors:function(){ return ORDRE_DEC.slice(); },
    betes:function(){ return ORDRE_B.concat(ORDRE_C); },
    poserBete:function(i, k, a, d){ M.betes[i] = M.betes[i] || [];
      M.betes[i].push({ k:k, a:a||0, d:d===undefined?.3:d, r:0 }); sauver(); poserBetes(); },
    choisirBete:choisirBete, texteDe:texteDe, lireTexte:lireTexte,

    cellules:function(){ return betesVives.map(function(g){

        zone:g.userData.zone ? g.userData.zone.length : 0 }; }); },
    sauts:function(){ return NSAUTS; },
    forcerSaut:function(n){ var g = betesVives[n||0]; if(!g) return null;
      var u = g.userData;
      var v = (VOISINS[u.cv]||[]).filter(function(c){ return u.zone.indexOf(c) >= 0; });
      if(!v.length) return null;

      placerBete(g); lancerSaut(g);
      return { k:u.k, de:u.cv, vers:u.migre, h:+u.cross.h.toFixed(3),

    pas:function(dt, n){ animerBetes(dt);
      var g = betesVives[n||0];
      return g ? { alt:+(g.position.length() - R0).toFixed(3),

    positions:function(){ return betesVives.map(function(g){

    poserDec:function(i, k, a, d){ M.decors[i] = M.decors[i] || [];

  /* M est remplacé quand on change de code ou qu'on reprend une sauvegarde :
     un accesseur, sinon la poignée garderait l'ancienne planète */
  Object.defineProperty(window.__MONDE, "M", { get:function(){ return M; } });
  if(window.console && console.info)
    console.info("monde assemble en", Math.round(performance.now() - t0), "ms ·",
      CELLS.length, "cellules");
  requestAnimationFrame(boucle);
}, 30);
})();
</script>
