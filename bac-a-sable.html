<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#05070F;color:#E9EAF4;overflow:hidden;
    font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px;line-height:1.45;-webkit-user-select:none;user-select:none}
  #scene{position:fixed;inset:0;touch-action:none;cursor:grab}
  #scene.drag{cursor:grabbing}
  #scene canvas{display:block;width:100%;height:100%}
  .f{font-family:"Space Grotesk","Trebuchet MS",system-ui,sans-serif}

  /* ── barre du haut ── */
  /* la barre s'arrête au bord de l'atelier : sinon les boutons du bac à sable
     passent dessous et se superposent à son titre */
  .haut{position:fixed;top:0;left:0;right:352px;z-index:6;display:flex;align-items:center;

  .outils{margin-left:auto;display:flex;align-items:center;flex-wrap:wrap;

  .puce b{font-variant-numeric:tabular-nums}
  .puce.cri{color:#9BE0FF} .puce.gra{color:#FFD9A0}
  .puce.bac{color:#FFC9A0;border-color:rgba(255,201,160,.45);

  .sauve{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#7FD8A4;

  /* ── la fenêtre de sauvegarde ── */

  .boite{background:#0C1022;border:1px solid rgba(255,255,255,.14);border-radius:18px;

  .boite h2{font-family:"Space Grotesk",sans-serif;font-size:19px;margin:0 0 4px}
  .boite p{font-size:13.5px;line-height:1.5;opacity:.78;margin:0 0 12px}
  .boite textarea{width:100%;height:120px;background:rgba(255,255,255,.05);color:#E9EAF4;
    border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;resize:vertical;
    word-break:break-all}
  .boite input[type=text]{width:100%;background:rgba(255,255,255,.05);color:#E9EAF4;
    border:1px solid rgba(255,255,255,.14);border-radius:11px;padding:10px 12px;
    font:inherit;font-size:15px}
  .rang{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .bt{font:inherit;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:14px;
    padding:9px 15px;border-radius:11px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.07);color:#E9EAF4;cursor:pointer}
  .bt:hover{border-color:rgba(255,255,255,.4)}
  .bt.pri{background:rgba(155,224,255,.16);border-color:rgba(155,224,255,.5);color:#CFEFFF}
  .bt.dan{background:rgba(255,140,124,.13);border-color:rgba(255,140,124,.45);color:#FFC2B8}
  .msg{font-size:12.5px;margin-top:9px;min-height:16px;color:#9BE0FF}
  .msg.mal{color:#FFB4A8}
  .puce.nom{cursor:text;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
  .lien{background:none;border:none;color:#E6E9FA;font:inherit;font-size:13.5px;cursor:pointer;
    pointer-events:auto;opacity:.8;text-decoration:underline;text-underline-offset:3px;padding:6px}
  .lien:hover{opacity:1}

  /* ── panneau boutique ── */
  .pan{position:fixed;top:0;right:0;bottom:0;width:352px;max-width:86vw;z-index:5;
    background:rgba(8,11,24,.86);backdrop-filter:blur(11px);
    border-left:1px solid rgba(255,255,255,.09);display:flex;flex-direction:column;
    transform:translateX(0);transition:transform .3s ease}
  .pan.ferme{transform:translateX(100%)}
  .pan header{padding:16px 18px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .pan h1{font-family:"Space Grotesk",sans-serif;font-size:20px;font-weight:700;margin:0}
  .pan .st{font-size:12px;text-transform:uppercase;letter-spacing:.12em;opacity:.55;margin:2px 0 0}
  .onglets{display:flex;gap:6px;padding:11px 14px 0}
  .onglets button[hidden]{display:none}
  .onglets button{flex:1;font:inherit;font-family:"Space Grotesk",sans-serif;font-weight:600;
    font-size:12px;padding:8px 2px;border-radius:11px 11px 0 0;border:1px solid transparent;
    border-bottom:none;background:transparent;color:#9FA3BE;cursor:pointer}
  .onglets button.on{background:rgba(255,255,255,.07);color:#E9EAF4;border-color:rgba(255,255,255,.12)}
  .liste{flex:1;overflow-y:auto;padding:11px 14px 16px}
  .art{display:flex;gap:11px;align-items:center;width:100%;text-align:left;font:inherit;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;
    padding:9px 12px;margin-bottom:7px;color:#E9EAF4;cursor:pointer}
  .art:hover{border-color:rgba(255,255,255,.3)}
  .art.on{background:rgba(155,224,255,.14);border-color:rgba(155,224,255,.55)}
  .art.pris{opacity:.5;cursor:default}
  .art.cher{opacity:.42}
  .art .ic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:17px;background:rgba(255,255,255,.08)}
  .art .tx{flex:1;min-width:0}
  .art .n{font-weight:600;font-size:14.5px;display:block;line-height:1.2}
  .art .s{font-size:11.5px;opacity:.6;display:block}
  .art .pr{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;color:#9BE0FF;
    flex:none;white-space:nowrap}
  .art.pris .pr{color:#7FD8A4}
  .grp{font-size:11px;text-transform:uppercase;letter-spacing:.11em;opacity:.45;
    margin:13px 0 7px;font-weight:600}
  .grp:first-child{margin-top:2px}
  .vide{font-size:13px;opacity:.55;line-height:1.5;padding:6px 2px}
  .releve{display:flex;flex-direction:column;gap:3px;opacity:.72}
  .releve b{color:#9BE0FF;font-variant-numeric:tabular-nums}
  .releve .ec b{color:#FFD9A0}

  /* ── bandeau du bas ── */
  .bas{position:fixed;left:0;right:352px;bottom:0;z-index:6;display:flex;justify-content:center;
    padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
  .bas.large{right:0}
  .info{background:rgba(10,14,30,.76);border:1px solid rgba(255,255,255,.1);border-radius:14px;
    padding:9px 16px;font-size:13.5px;backdrop-filter:blur(5px);pointer-events:auto;
    max-width:min(560px,92vw);text-align:center;line-height:1.4}
  .info b{color:#9BE0FF}
  .info .ret,.info .act{margin-left:9px;font-size:12.5px;text-decoration:underline;
    text-underline-offset:3px;cursor:pointer;background:none;border:none;font-family:inherit}
  .info .ret{color:#FFB4A8}
  .info .act{color:#9BE0FF}

  .charge{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    z-index:9;background:#05070F;font-size:14px;letter-spacing:.06em;opacity:.75}
  .charge[hidden]{display:none!important}
  .ouvrir{position:fixed;right:16px;top:58px;z-index:7;display:none;
    background:rgba(10,14,30,.8);border:1px solid rgba(255,255,255,.16);text-decoration:none;
    font-family:"Space Grotesk",sans-serif;font-weight:600}
  .pan.ferme ~ .ouvrir{display:block}
  #bFermer{display:none}
  @media (max-width:760px){ #bFermer{display:block} }

  @media (max-width:760px){
    .pan{top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;height:52vh;
      border-left:none;border-top:1px solid rgba(255,255,255,.09);
      transform:translateY(0);border-radius:16px 16px 0 0}
    .pan.ferme{transform:translateY(calc(100% - 0px))}
    .bas{right:0;bottom:52vh;padding-bottom:10px}
    .bas.large{bottom:0;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
    .haut{right:0;padding:10px 12px}
    .puce{font-size:12.5px;padding:5px 11px}
    .ouvrir{top:auto;bottom:14px;right:14px}
  }
</style>

<div class="haut" id="barre">

<script>
if(!window.THREE){ document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/scr'+'ipt>'); }

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
if(!window.THREE){ $("charge").textContent = "La bibliothèque 3D n'a pas pu être chargée."; return; }

var BAC = true;

/* ═══════════════ le barème ═══════════════
   Cinq nombres, et c'est tout le système économique du monde. Les changer ici
   les change partout : dans l'atelier, dans l'étiquette du hub, et dans le
   relevé montré au patient. */
var GAIN = {
  depart:   15,   /* de quoi s'offrir la première transformation tout de suite */
  parJeu:    5,   /* pour chaque jeu mené à son terme */
  parJour:  12,   /* pour chaque jour où le patient est venu : c'est le gros */
  parRecord: 3,   /* un petit quelque chose pour un record personnel */
  jourEclat: 5    /* un éclat ✦ tous les cinq jours de venue */
};
/* Le jour, et non la séance : sinon enchaîner dix parties d'affilée rapporterait
   autant que revenir dix fois, et c'est le retour qu'on veut renforcer. */
function gainsDe(liste){
  var jours = {}, jeux = 0, rec = 0;
  (liste || []).forEach(function(l){
    jeux++;
    if(l.record) rec++;
    if(l.date) jours[l.date] = 1;
  });
  var nj = Object.keys(jours).length;
  return {
    cri: GAIN.depart + jeux*GAIN.parJeu + nj*GAIN.parJour + rec*GAIN.parRecord,
    gra: Math.floor(nj / GAIN.jourEclat),
    jeux: jeux, jours: nj, records: rec
  };
}

/* ═══════════════ état, code patient, sauvegarde ═══════════════ */
/* BAC : la version d'essai du clinicien. Rangée sous une autre clé, avec une
   réserve de cristaux qu'on ne peut pas épuiser, pour pouvoir tout regarder
   sans toucher aux planètes des patients. */
var K_MONDE = BAC ? "orbite_monde_bac_v1" : "orbite_monde_v1";
var K_LOG = "archipel_log_v1";
                    /* de quoi s'offrir la première chose tout de suite */

var K_CODE = "orbite_monde_code";
/* Dans L'Orbite le code vient du hub. Ouverte seule, la page se souvient du
   dernier code saisi : le patient qui la garde en marque-page retrouve sa
   planète sans rien retaper. */
var DANS_ORBITE = (function(){
  try{ var p = window.parent; return !!(p && p !== window && p.ORBITE); }catch(e){ return false; }
})();
/* Deux codes, et il faut les distinguer. CODE_LOG est celui qui figure dans le
   journal des séances — il peut être vide quand le clinicien n'a ouvert aucune
   séance. CODE est celui sous lequel la planète est rangée, et il ne peut pas
   être vide, d'où « essai ». Les confondre faisait que le hub et la planète
   n'annonçaient pas le même solde lors d'une démonstration sans code. */
var CODE_LOG = (function(){
  if(BAC) return "bac";
  try{ var p = window.parent;
    if(p && p !== window && p.ORBITE && typeof p.ORBITE.code === "string") return p.ORBITE.code;
  }catch(e){}
  if(DANS_ORBITE) return "";
  try{ var c = localStorage.getItem(K_CODE); if(c) return c; }catch(e){}
  return "essai";
})();
var CODE = CODE_LOG || "essai";
var RETOUR = (function(){
  try{ var p = window.parent; if(p && p !== window && p.ORBITE && p.ORBITE.retour) return p.ORBITE.retour; }catch(e){}
  return null;
})();

function hash(t){
  var h = 5381;
  for(var i = 0; i < t.length; i++) h = ((h * 33) ^ t.charCodeAt(i)) >>> 0;
  return h;
}
function lireTout(){ try{ return JSON.parse(localStorage.getItem(K_MONDE) || "{}"); }catch(e){ return {}; } }
function sauver(){
  /* on grave la dépense dans la sauvegarde : L'Orbite affiche ainsi le solde
     sans avoir à embarquer une copie du catalogue et de ses prix */
  M.dep = depense();
  /* On grave aussi ce qui a été gagné. Le journal des séances ne voyage pas
     avec la sauvegarde — et il peut disparaître d'un simple nettoyage du
     navigateur. Sans cette trace, un patient qui reprend sa planète ailleurs
     la retrouverait avec un solde négatif et ne pourrait plus rien acheter. */
  M.gag = Math.max(M.gag || 0, gainsDe(seances()).cri);
  /* toute écriture peut avoir changé un sol ou une transformation : on invalide
     le cache de couleurs ici, une bonne fois, plutôt qu'à chaque appelant */
  couleursSales = true;
  var t = lireTout(); t[CODE] = M;
  try{ localStorage.setItem(K_MONDE, JSON.stringify(t)); }catch(e){}
  try{ if(window.parent && window.parent !== window && window.parent.ORBITE
        && window.parent.ORBITE.miroirMonde) window.parent.ORBITE.miroirMonde(); }catch(e){}
  annoncerSauvegarde();
}
var M = (function(){
  var t = lireTout()[CODE];
  if(t && t.glob && t.cells) return t;
  return { nom:"Ma planète", graine: hash(CODE) % 100000, niv:3, glob:{}, cells:{} };
})();
/* Le niveau de finesse est gravé dans le monde à sa création : les cases sont
   repérées par leur numéro, et ce numéro change avec la finesse. Un monde déjà
   commencé garde donc le sien, quoi qu'il arrive au réglage par défaut. */
if(!M.niv) M.niv = 3;
if(!M.pos) M.pos = {};              /* place fine d'un objet dans sa case */
if(!M.decors) M.decors = {};        /* petits décors posés au sol */
if(!M.terre) M.terre = {};          /* cases dont le patient a changé le sol */
if(!M.betes) M.betes = {};          /* ce qui vit sur la planète */
var GRAINE = M.graine;

/* ═══════════════ ce qui s'achète ═══════════════ */
/* Les prix sont taillés pour que chacune des premières venues produise une
   transformation visible : la planète devient un monde pendant que le patient
   est encore en train de découvrir l'outil, et la longue traîne est le
   meublage — objets, décors, animaux — qui, lui, n'a pas de fin. Un catalogue
   dont les gros effets arrivent au bout de six semaines ne renforce rien. */
var TERRA = [
  { id:"atmos",  nom:"Une atmosphère", ic:"🜁", prix:10,
    s:"Le ciel se colore et la planète respire" },
  { id:"eau",    nom:"De l'eau",       ic:"🌊", prix:18,
    s:"Les bassins se remplissent, les océans apparaissent" },
  { id:"herbe",  nom:"De la végétation", ic:"🌿", prix:26,
    s:"Les plaines verdissent" },
  { id:"relief", nom:"Du relief",      ic:"⛰", prix:36,
    s:"Les montagnes se soulèvent et la neige s'installe" },
  { id:"climat", nom:"Un climat",      ic:"❄", prix:48,
    s:"Déserts, toundras et banquises se répartissent" },
  { id:"nuages", nom:"Des nuages",     ic:"☁", prix:60,
    s:"Un voile de nuages tourne au-dessus du sol" },
  { id:"lune",   nom:"Une lune",       ic:"🌘", prix:75,
    s:"Un satellite se met en orbite" },
  { id:"anneau", nom:"Un anneau",      ic:"◯", prix:95,
    s:"Un anneau de poussière ceinture la planète" }
];

/* req : la transformation qui révèle le biome. Le catalogue grandit avec la
   planète — au premier passage, il n'y a qu'une chose à faire, et c'est voulu. */
var OBJETS = {
  arbre:   { nom:"Un arbre",       ic:"🌳", prix:2,  bio:["plaine","toundra"], req:"herbe" },
  foret:   { nom:"Une forêt",      ic:"🌲", prix:6,  bio:["plaine"],           req:"herbe" },
  champs:  { nom:"Des champs",     ic:"🌾", prix:4,  bio:["plaine"],           req:"herbe" },
  lac:     { nom:"Un lac",         ic:"💧", prix:5,  bio:["plaine","toundra"], req:"eau" },
  palmier: { nom:"Des palmiers",   ic:"🌴", prix:3,  bio:["plage"],            req:"eau" },
  bateau:  { nom:"Un bateau",      ic:"⛵", prix:9,  bio:["ocean"],            req:"eau" },
  phare:   { nom:"Un phare",       ic:"🗼", prix:10, bio:["plage"],            req:"eau" },
  village: { nom:"Un village",     ic:"🏘", prix:12, bio:["plaine","plage"],   req:"herbe" },
  rocher:  { nom:"Un pic rocheux", ic:"🪨", prix:4,  bio:["montagne","desert","plaine","neige"], req:"relief" },
  sapins:  { nom:"Des sapins",     ic:"🌲", prix:5,  bio:["toundra","montagne"], req:"relief" },
  volcan:  { nom:"Un volcan",      ic:"🌋", prix:20, bio:["montagne","neige"], req:"relief" },
  cactus:  { nom:"Des cactus",     ic:"🌵", prix:3,  bio:["desert"],           req:"climat" },
  igloo:   { nom:"Un igloo",       ic:"🧊", prix:8,  bio:["banquise","toundra"], req:"climat" }
};
var ORDRE_OBJ = ["arbre","foret","champs","lac","palmier","bateau","phare","village",
                 "rocher","sapins","volcan","cactus","igloo"];
var NOM_BIOME = { ocean:"océan", banquise:"banquise", plage:"plage", plaine:"plaine",
  desert:"désert", toundra:"toundra", montagne:"montagne", neige:"neige" };
/* l'article va avec le mot : « sur le désert », « sur la plaine », « sur l'océan » */
var ART = { ocean:"l'océan", banquise:"la banquise", plage:"la plage", plaine:"la plaine",
  desert:"le désert", toundra:"la toundra", montagne:"la montagne", neige:"la neige" };

/* ═══════════════ l'économie ═══════════════
   Un objet occupe une case entière : si l'on affine la grille, il en faut
   quatre fois plus pour couvrir la même étendue. Son prix suit donc l'aire
   d'une case, et meubler un bout de planète coûte le même effort quelle que
   soit la finesse. Les transformations, elles, changent la planète entière et
   ne dépendent de rien. Les décors se posent librement, pas par case : leur
   prix ne bouge pas non plus. */
function prixObj(k){
  var o = OBJETS[k]; if(!o) return 0;
  return Math.max(1, Math.round(o.prix * ECHC * ECHC));
}
function seances(){
  var l = [];
  try{ l = JSON.parse(localStorage.getItem(K_LOG) || "[]"); }catch(e){}
  return l.filter(function(x){ return x.code === CODE_LOG; });
}
function gagne(){
  var g = gainsDe(seances());
  if(M.gag && M.gag > g.cri) g.cri = M.gag;
  if(BAC){ g.cri += 99999; g.gra += 999; }
  g.n = g.jours;                     /* « passages » = jours de venue */
  g.r = g.records;
  return g;
}
function depense(){
  var d = 0;
  TERRA.forEach(function(t){ if(M.glob[t.id]) d += t.prix; });
  for(var i in M.cells) d += prixObj(M.cells[i]);
  for(var j in M.decors){
    (M.decors[j] || []).forEach(function(q){ var e = DECORS[q.k]; if(e) d += e.prix; });
  }
  /* les créatures se paient en éclats, pas en cristaux : elles sont comptées à
     part, dans depenseGra */
  d += depenseBetes();
  return d;
}
function solde(){ return gagne().cri - depense(); }

/* ═══════════════ construction de la scène ═══════════════ */
function construire(){
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  /* Le rendu physique produit des hautes lumières qui dépassent l'écran ; les
     écrêter brutalement donne des aplats blancs. La courbe ACES les ramène en
     douceur — c'est le réglage qui, à lui seul, fait le plus pour l'image. */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = false;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $("scene").appendChild(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(42, 16/9, .5, 500);

  ambiant = new THREE.AmbientLight(C(0x8C92C0), .22); scene.add(ambiant);
  /* une lumière de ciel plutôt qu'une lumière plate : bleu par-dessus, rappel
     chaud du sol par-dessous. C'est ce qui donne du volume aux faces à l'ombre. */
  hemi = new THREE.HemisphereLight(C(0x9FC4F0), C(0x6B5B42), .55); scene.add(hemi);
  soleil = new THREE.DirectionalLight(C(0xFFF4E2), 1.05);
  soleil.position.set(1, .62, .8); scene.add(soleil);
  var app = new THREE.DirectionalLight(C(0x7FA8FF), .3);
  app.position.set(-.9, -.3, -.7); scene.add(app);

  /* le fond étoilé */
  var pts = [], n = 700;
  for(var i = 0; i < n; i++){
    var a = Math.random()*6.2832, b = Math.acos(2*Math.random() - 1), r = 120 + Math.random()*90;
    pts.push(Math.sin(b)*Math.cos(a)*r, Math.cos(b)*r, Math.sin(b)*Math.sin(a)*r);
  }
  var gg = new THREE.BufferGeometry();
  gg.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  etoiles = new THREE.Points(gg, new THREE.PointsMaterial({ color:C(0xE6ECFF), size:.55,
    transparent:true, opacity:.75, fog:false }));
  scene.add(etoiles);

  monde = new THREE.Group(); scene.add(monde);
  preparerMonde();
  preparerCiel();
  construireGlobe(M.glob);
  contour = new THREE.LineLoop(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color:C(0xFFFFFF), transparent:true, opacity:.85 }));
  contour.visible = false; monde.add(contour);
  majDecor();
  Object.keys(M.cells).forEach(function(i){ poser(parseInt(i, 10), M.cells[i], true); });
  poserDecors(); poserBetes();
  redim();
  window.addEventListener("resize", redim);
}

/* halo, nuages, lune, anneau : ce qui s'ajoute avec les transformations */

  var o = M.glob;
  if(halo){ monde.remove(halo); halo = null; }
  if(o.atmos){
    halo = new THREE.Mesh(new THREE.SphereGeometry(R0 * 1.09, 32, 22),
      new THREE.MeshBasicMaterial({ color:C(0x7FB8FF), transparent:true, opacity:.14,
        side:THREE.BackSide, depthWrite:false, blending:THREE.AdditiveBlending }));
    monde.add(halo);
  }
  if(nuages){ monde.remove(nuages); nuages = null; }
  if(o.nuages){
    nuages = new THREE.Group();
    var mc = new THREE.MeshStandardMaterial({ color:C(0xF4F7FB), roughness:1, flatShading:true,
      transparent:true, opacity:.82 });
    for(var i = 0; i < 16; i++){
      var a = (i/16)*6.2832 + Math.sin(i*3.1)*.6, b = Math.acos(2*((i*.618) % 1) - 1);
      var r = R0 * 1.30, g = new THREE.Group();
      for(var k = 0; k < 3; k++){
        var s = sp(.38 + (k % 2) * .2, mc, 7);
        s.position.set(k*.75 - .75, 0, ((k*7) % 3) * .22 - .22);

      }
      g.position.set(Math.sin(b)*Math.cos(a)*r, Math.cos(b)*r, Math.sin(b)*Math.sin(a)*r);
      g.lookAt(0, 0, 0); g.rotateX(Math.PI/2);
      nuages.add(g);
    }
    monde.add(nuages);
  }
  if(lune){ scene.remove(lune); lune = null; }
  if(o.lune){
    lune = new THREE.Group();
    var b = sp(1.5, mm(0xC9C6BC), 14); lune.add(b);
    [[.6,.5,.35],[-.7,-.3,.28],[.2,-.8,.22]].forEach(function(p){
      var cr = new THREE.Mesh(new THREE.CircleGeometry(p[2], 9), mm(0xAFABA1));
      var v = new THREE.Vector3(p[0], p[1], Math.sqrt(Math.max(.01, 1-p[0]*p[0]-p[1]*p[1])));
      cr.position.copy(v.clone().multiplyScalar(1.51));
      cr.lookAt(v.clone().multiplyScalar(4)); lune.add(cr);

    [[14.5, 16.4, .28], [16.9, 18.6, .18], [19.1, 20.2, .11]].forEach(function(q){

          side:THREE.DoubleSide, depthWrite:false }));
      r.rotation.x = Math.PI/2; anneau.add(r);
    });

/* ═══════════════ poser et retirer ═══════════════ */
function poser(i, id, muet){
  if(objets[i]){ monde.remove(objets[i]); delete objets[i]; }
  var g = FAIRE[id]();
  /* un objet tient dans sa case : si on affine la grille, il rétrécit avec */
  g.scale.setScalar(.95 * ECHC);
  g.userData = { cell:i, type:"obj" };
  placerObjet(i, g);
  monde.add(g); objets[i] = g;
  if(!muet){ M.cells[i] = id; sauver(); }
}
function retirer(i){
  if(objets[i]){ monde.remove(objets[i]); delete objets[i]; }
  delete M.cells[i]; delete M.pos[i];
  sauver(); majSolde(); remplirListe();
}
/* après une transformation, l'altitude des cases change : tout ce qui est posé
   doit redescendre ou remonter avec son sol */
function replacerObjets(){
  Object.keys(objets).forEach(function(i){ placerObjet(parseInt(i, 10), objets[i]); });
  poserDecors();
}

/* ═══════════════ bruit de valeur, en trois dimensions ═══════════════ */
function gr(i, j, k){
  var n = (i|0)*374761393 + (j|0)*668265263 + (k|0)*1442695041 + GRAINE*2654435761;
  n = (n ^ (n >>> 13)) * 1274126177;
  n = n ^ (n >>> 16);
  return ((n >>> 0) / 2147483647.5) - 1;
}
function bruit(x, y, z){
  var i = Math.floor(x), j = Math.floor(y), k = Math.floor(z);
  var fx = x-i, fy = y-j, fz = z-k;
  var ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy), uz = fz*fz*(3-2*fz);
  function h(a, b, c){ return gr(i+a, j+b, k+c); }
  var a0 = h(0,0,0) + (h(1,0,0)-h(0,0,0))*ux, a1 = h(0,1,0) + (h(1,1,0)-h(0,1,0))*ux;
  var b0 = h(0,0,1) + (h(1,0,1)-h(0,0,1))*ux, b1 = h(0,1,1) + (h(1,1,1)-h(0,1,1))*ux;
  return (a0 + (a1-a0)*uy) + ((b0 + (b1-b0)*uy) - (a0 + (a1-a0)*uy))*uz;
}
function fbm(x, y, z, oct, f0){
  var s = 0, a = 1, f = f0 || 1, t = 0;
  for(var i = 0; i < oct; i++){
    s += a * bruit(x*f, y*f, z*f); t += a; a *= .5; f *= 2.05;
  }
  return s / t;
}

/* ═══════════════ l'icosphère et son pavage dual ═══════════════ */
function normaliser(p){
  var l = Math.sqrt(p[0]*p[0] + p[1]*p[1] + p[2]*p[2]);
  return [p[0]/l, p[1]/l, p[2]/l];
}
function icosaedre(){
  var t = (1 + Math.sqrt(5)) / 2;
  var v = [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],
           [0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(normaliser);
  var f = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],
           [10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],
           [2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  return { v:v, f:f };
}
function subdiviser(g){
  var v = g.v.slice(), f = [], cache = {};
  function milieu(a, b){
    var k = a < b ? a + "_" + b : b + "_" + a;
    if(cache[k] !== undefined) return cache[k];
    var p = normaliser([(v[a][0]+v[b][0])/2, (v[a][1]+v[b][1])/2, (v[a][2]+v[b][2])/2]);
    v.push(p); cache[k] = v.length - 1; return cache[k];
  }
  g.f.forEach(function(t){
    var a = milieu(t[0], t[1]), b = milieu(t[1], t[2]), c = milieu(t[2], t[0]);
    f.push([t[0],a,c], [t[1],b,a], [t[2],c,b], [a,b,c]);
  });
  return { v:v, f:f };
}

/* Le dual : chaque sommet devient une cellule, dont les coins sont les centres
   des faces qui l'entourent, rangés dans le sens trigonométrique autour de lui. */
var ADJ = null;
function construireGrille(niveau){
  var g = icosaedre();
  for(var s = 0; s < niveau; s++) g = subdiviser(g);
  var V = g.v, F = g.f;
  /* L'adjacence se lit directement dans la triangulation : deux cases se
     touchent si leurs sommets sont reliés par une arête. C'est exact et
     instantané, là où comparer les distances deux à deux coûtait le carré du
     nombre de cases — impraticable dès qu'on l'augmente. */
  ADJ = [];
  for(var n0 = 0; n0 < V.length; n0++) ADJ.push([]);
  F.forEach(function(t){
    [[t[0],t[1]],[t[1],t[2]],[t[2],t[0]]].forEach(function(e){
      if(ADJ[e[0]].indexOf(e[1]) < 0) ADJ[e[0]].push(e[1]);
      if(ADJ[e[1]].indexOf(e[0]) < 0) ADJ[e[1]].push(e[0]);
    });
  });
  var autour = [];
  for(var i = 0; i < V.length; i++) autour.push([]);
  var C = [];
  F.forEach(function(t, k){
    C.push(normaliser([(V[t[0]][0]+V[t[1]][0]+V[t[2]][0])/3,
                       (V[t[0]][1]+V[t[1]][1]+V[t[2]][1])/3,
                       (V[t[0]][2]+V[t[1]][2]+V[t[2]][2])/3]));
    t.forEach(function(iv){ autour[iv].push(k); });
  });
  var cells = [];
  for(var n = 0; n < V.length; n++){
    var p = V[n], fs = autour[n];
    /* base tangente pour ranger les coins par angle */
    var ref = Math.abs(p[1]) < .9 ? [0,1,0] : [1,0,0];
    var u = normaliser([p[1]*ref[2]-p[2]*ref[1], p[2]*ref[0]-p[0]*ref[2], p[0]*ref[1]-p[1]*ref[0]]);
    var w = [p[1]*u[2]-p[2]*u[1], p[2]*u[0]-p[0]*u[2], p[0]*u[1]-p[1]*u[0]];
    fs.sort(function(a, b){
      var ca = C[a], cb = C[b];
      var aa = Math.atan2(ca[0]*w[0]+ca[1]*w[1]+ca[2]*w[2], ca[0]*u[0]+ca[1]*u[1]+ca[2]*u[2]);
      var ab = Math.atan2(cb[0]*w[0]+cb[1]*w[1]+cb[2]*w[2], cb[0]*u[0]+cb[1]*u[1]+cb[2]*u[2]);
      return aa - ab;
    });
    cells.push({ c:p, coins:fs.map(function(k){ return C[k]; }) });
  }
  return cells;
}

/* ═══════════════ altitude, latitude, biome ═══════════════ */
var MER = -.02;                      /* niveau de la mer dans l'échelle du bruit */
function altitude(p){
  /* Deux échelles seulement, et une basse fréquence dominante : c'est ce qui
     donne de vrais continents plutôt qu'un semis d'îles. Le détail ne sert
     qu'à découper les côtes et à creuser les vallées. */
  var cont = fbm(p[0]*.95 + 4.2, p[1]*.95, p[2]*.95, 2, 1);
  var det  = fbm(p[0]*3.2 - 2.7, p[1]*3.2, p[2]*3.2, 4, 1);
  return cont * 1.02 + det * .19;
}
function biome(h, lat, hum){
  var froid = Math.abs(lat);
  if(h < MER) return (froid > .80) ? "banquise" : "ocean";
  if(h < MER + .045) return (froid > .76) ? "banquise" : "plage";
  if(froid > .76) return "toundra";
  /* seuils hauts : la montagne doit rester une chaîne, pas le paysage par défaut */
  if(h > .72) return "neige";
  if(h > .47) return "montagne";
  if(hum < -.20 && froid > .12 && froid < .46) return "desert";
  return "plaine";
}

/* ═══════════════ le maillage ═══════════════
   Chaque cellule est un prisme : une face du dessus à son altitude, et des
   parois verticales qui descendent au niveau voisin. Ce sont les parois qui
   font lire la planète comme un pavage plutôt que comme une boule bruitée. */
var R0 = 10, HMAX = 1.7;
var CELLS = null, INFO = null, planete = null, matSol = null;

/* Palette volontairement peu saturée et peu contrastée : ce qui fait qu'un
   monde en tuiles paraît peint plutôt que colorié, ce sont des teintes proches
   les unes des autres, et des transitions — pas des aplats francs. */
var NU = 0x93836B;
function teinte(b, o){
  /* o : ce qui est débloqué. Avant l'eau, l'océan est un bassin de roche nue ;
     avant l'herbe, la plaine est terreuse ; avant le climat, tout est tempéré. */
  if(b === "ocean")    return o.eau ? (o.atmos ? 0x2F7BAC : 0x2A6A93) : 0x5F5A51;
  if(b === "banquise") return o.climat ? 0xD2DFE8 : (o.eau ? 0x2F7BAC : 0x5F5A51);
  if(b === "plage")    return o.eau ? 0xE0CFA6 : 0x746F67;
  if(b === "plaine")   return o.herbe ? 0x7FA05C : NU;
  if(b === "desert")   return o.climat ? 0xDCC087 : (o.herbe ? 0x7FA05C : NU);
  if(b === "toundra")  return o.climat ? 0x9BA684 : (o.herbe ? 0x7FA05C : NU);
  if(b === "montagne") return o.relief ? 0x8B8278 : (o.herbe ? 0x7FA05C : NU);
  if(b === "neige")    return o.relief ? 0xE6ECEF : (o.herbe ? 0x7FA05C : NU);
  return NU;
}

/* ═══════════════ les coins partagés ═══════════════
   Chaque coin d'une case appartient à trois cases. Si les trois y posent la
   même couleur — la moyenne des leurs — alors le pourtour de chaque tuile se
   fond dans ses voisines au lieu de s'arrêter net. C'est ce dégradé, et lui
   seul, qui distingue un monde peint d'un monde colorié case par case. */
var COINS3 = null;
function cleCoin(q){
  return q[0].toFixed(4) + "|" + q[1].toFixed(4) + "|" + q[2].toFixed(4);
}
function calculerCoins(){
  var m = {}, i, k;
  for(i = 0; i < CELLS.length; i++)
    for(k = 0; k < CELLS[i].coins.length; k++){
      var c = cleCoin(CELLS[i].coins[k]);
      (m[c] = m[c] || []).push(i);
    }
  COINS3 = [];
  for(i = 0; i < CELLS.length; i++){
    var t = [];
    for(k = 0; k < CELLS[i].coins.length; k++) t.push(m[cleCoin(CELLS[i].coins[k])] || [i]);
    COINS3.push(t);
  }
}
var COULEURS = null, couleursSales = true;
function prepCouleurs(o){
  if(!COINS3) calculerCoins();
  if(COULEURS && !couleursSales) return;
  couleursSales = false;
  COULEURS = [];
  for(var i = 0; i < CELLS.length; i++){
    var c = CELLS[i].c;
    var col = new THREE.Color(teinte(bioDe(i), o)).convertSRGBToLinear();
    /* une dérive très lente d'une case à l'autre : deux plaines voisines ne
       sont jamais exactement de la même couleur */
    var v = fbm(c[0]*1.7 + 11.3, c[1]*1.7, c[2]*1.7, 2, 1) * .055;
    col.r = Math.max(0, Math.min(1, col.r * (1 + v)));
    col.g = Math.max(0, Math.min(1, col.g * (1 + v)));
    col.b = Math.max(0, Math.min(1, col.b * (1 + v*.6)));
    COULEURS.push(col);
  }
}
function coinCouleur(i, k){
  var l = COINS3[i][k], r = 0, g = 0, b = 0;
  for(var n = 0; n < l.length; n++){ var c = COULEURS[l[n]]; r += c.r; g += c.g; b += c.b; }
  return [r/l.length, g/l.length, b/l.length];
}
/* L'épaule : le pourtour de chaque tuile redescend un peu, ce qui arrondit
   l'arête. Deux cases de même altitude se rejoignent alors en une rainure
   douce au lieu de deux blocs collés. */
var NIV = 3, ECHC = 1, RANGS = 3;
var EPAULE = .085, EPBORD = .18;
function epaule(a0){ return a0 >= EPBORD ? 0 : (1 - a0/EPBORD) * EPAULE; }
/* Combien de la couleur des voisines à un point donné. Le centre d'une tuile
   reste franc, et tout le fondu se joue dans son tiers extérieur : plus tôt et
   la carte devient une bouillie, plus tard et les cases redeviennent des
   pastilles posées côte à côte. */
function melange(a0){ return Math.pow(Math.max(0, 1 - a0/.62), 1.7); }
var FOND = 2.4;                      /* profondeur des parois sous R0 */
/* ═══════════════ ce que le patient a retouché ═══════════════
   La géologie donne un monde ; M.terre garde les endroits où le patient n'était
   pas d'accord avec elle. Un seul point de lecture — bioDe et hauteurCell — et
   tout le reste (couleur, relief, pose, diorama) suit sans le savoir. */
var PAS = .42;                       /* un cran d'élévation, en unités de scène */
function bioDe(i){
  var t = M.terre && M.terre[i];
  return (t && t.b) || INFO[i].b;
}
function cranDe(i){
  var t = M.terre && M.terre[i];
  return (t && t.h) || 0;
}
function hauteurCell(i, o){
  var b = bioDe(i), cr = cranDe(i) * PAS;
  if(b === "ocean") return -.22 + cr;
  /* on borne à .62 : sans cela, un sommet de bruit isolé perce la couche de
     nuages et la planète perd son échelle. Avant l'achat du relief, tout est
     presque plat — c'est ce qui rend le soulèvement spectaculaire. */
  var h = Math.min(.62, Math.max(0, INFO[i].h - MER)) / .62;
  return h * (o.relief ? HMAX * 1.45 : HMAX * .22) + cr;
}

/* Chaque tuile : un centre, un anneau intermédiaire à pleine hauteur, un
   pourtour légèrement abaissé — l'épaule — puis la paroi. Le centre porte la
   couleur de la case, le pourtour la moyenne des cases qui s'y touchent. */
function construireGlobe(o){
  if(planete){ monde.remove(planete); planete.geometry.dispose(); }
  prepCouleurs(o);
  var pos = [], col = [], idx = [], nor = [];
  var f = R0 - FOND;
  for(var i = 0; i < CELLS.length; i++){
    var cel = CELLS[i], n = cel.coins.length;
    var e = R0 + hauteurCell(i, o), e2 = e - EPAULE;
    var up = cel.c, self = COULEURS[i];
    var base = pos.length / 3;
    pos.push(up[0]*e, up[1]*e, up[2]*e);
    nor.push(up[0], up[1], up[2]);
    col.push(self.r, self.g, self.b);
    var cc = [];
    for(var kc = 0; kc < n; kc++) cc.push(coinCouleur(i, kc));
    /* trois anneaux plutôt qu'un : le fondu vers les voisines a besoin d'un peu
       de place pour être doux sans envahir le centre de la tuile */
    var ANN = [.45, EPBORD, 0];
    for(var r = 0; r < 3; r++){
      var a0 = ANN[r], m = melange(a0);
      for(var k = 0; k < n; k++){
        var q = cel.coins[k];
        var mx = up[0]*a0 + q[0]*(1-a0), my = up[1]*a0 + q[1]*(1-a0),
            mz = up[2]*a0 + q[2]*(1-a0);
        var ml = Math.sqrt(mx*mx + my*my + mz*mz);
        var ee = (r === 2) ? e2 : e;
        pos.push(mx/ml*ee, my/ml*ee, mz/ml*ee);
        if(r === 2){
          /* la normale de l'épaule penche un peu vers l'extérieur : assez pour
             arrondir l'arête, pas assez pour en faire un liseré */
          var ox = q[0]-up[0], oy = q[1]-up[1], oz = q[2]-up[2];
          var ol = Math.sqrt(ox*ox + oy*oy + oz*oz) || 1;
          var nx2 = up[0] + ox/ol*.42, ny2 = up[1] + oy/ol*.42, nz2 = up[2] + oz/ol*.42;
          var nl2 = Math.sqrt(nx2*nx2 + ny2*ny2 + nz2*nz2);
          nor.push(nx2/nl2, ny2/nl2, nz2/nl2);
        } else nor.push(up[0], up[1], up[2]);
        col.push(self.r + (cc[k][0]-self.r)*m, self.g + (cc[k][1]-self.g)*m,
          self.b + (cc[k][2]-self.b)*m);
      }
    }
    for(var k2 = 0; k2 < n; k2++){
      var s0 = base+1+k2, s1 = base+1+((k2+1)%n);
      idx.push(base, s0, s1);
      for(var r2 = 0; r2 < 2; r2++){
        var A0 = base+1+r2*n+k2, A1 = base+1+r2*n+((k2+1)%n);
        var B0 = A0+n, B1 = A1+n;
        idx.push(A0, B0, B1, A0, B1, A1);
      }
    }
    /* parois : on descend bien plus bas que la case la plus enfoncée possible,
       sinon une case abaissée par le patient passerait sous le fond et l'on
       verrait au travers */
    for(var k3 = 0; k3 < n; k3++){
      var a = cel.coins[k3], b = cel.coins[(k3 + 1) % n];
      var bs = pos.length / 3;
      var nx = a[0] + b[0], ny = a[1] + b[1], nz = a[2] + b[2];
      var nl = Math.sqrt(nx*nx + ny*ny + nz*nz);
      var ca = cc[k3], cb2 = cc[(k3 + 1) % n];
      [[a[0]*e2,a[1]*e2,a[2]*e2],[b[0]*e2,b[1]*e2,b[2]*e2],
       [b[0]*f,b[1]*f,b[2]*f],[a[0]*f,a[1]*f,a[2]*f]].forEach(function(p, kk){
        pos.push(p[0], p[1], p[2]);
        nor.push(nx/nl, ny/nl, nz/nl);
        /* le pied d'une paroi reçoit moins de lumière que son sommet */
        var src = (kk === 0 || kk === 3) ? ca : cb2, g2 = (kk < 2) ? .94 : .60;
        col.push(src[0]*g2, src[1]*g2, src[2]*g2);
      });
      /* L'ordre des sommets compte : pris dans l'autre sens, la paroi tourne le
         dos à l'extérieur, se fait éliminer au rendu, et le décrochement entre
         deux cases d'altitudes différentes laisse voir l'espace au travers. */
      idx.push(bs, bs+2, bs+1, bs, bs+3, bs+2);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(new THREE.Uint32BufferAttribute(idx, 1));
  matSol = matSol || new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.95,
    metalness:0 });
  planete = new THREE.Mesh(g, matSol);
  planete.castShadow = false; planete.receiveShadow = false;
  monde.add(planete);
  return planete;
}

/* ═══════════════ préparer la grille une fois pour toutes ═══════════════ */
function preparerMonde(){
  NIV = Math.max(3, Math.min(5, M.niv || 3));
  CELLS = construireGrille(NIV);
  /* rayon angulaire d'une case : l'aire de la sphère divisée par leur nombre.
     Tout ce qui se mesure « en cases » — pose, épaule, cran d'élévation,
     densité d'herbe, finesse du diorama — s'en déduit, si bien qu'on peut
     changer de finesse sans rien re-régler à la main. */
  RCELL = R0 * Math.sqrt(4 / CELLS.length);
  ECHC = RCELL / .789;
  EPAULE = .085 * ECHC;
  PAS = .53 * RCELL;
  /* Le diorama ne couvre qu'une poignée de cases : on peut y viser une taille
     de triangle fixe, indépendante de la finesse de la grille. C'est là, et non
     dans le nombre de cases, que se gagne le détail vu de près. */
  NSUB = Math.max(2, Math.min(10, Math.round(RCELL / .098)));
  RANGS = Math.max(3, Math.round(3 / ECHC));
  COINS3 = null; VOISINS = null; couleursSales = true;
  INFO = CELLS.map(function(cel){
    var h = altitude(cel.c);
    var lat = cel.c[1];
    var hum = fbm(cel.c[0]*2.2 + 9.1, cel.c[1]*2.2, cel.c[2]*2.2, 3, 1);
    return { h:h, lat:lat, hum:hum, b:biome(h, lat, hum) };
  });
}

/* position du dessus d'une cellule, là où se posent les objets */
function sommetCell(i, o){
  var cel = CELLS[i], e = R0 + hauteurCell(i, o) + .02;
  return new THREE.Vector3(cel.c[0]*e, cel.c[1]*e, cel.c[2]*e);
}
/* la cellule la plus proche d'un point du globe : 642 comparaisons, c'est
   instantané et ça évite d'avoir à indexer les triangles */
function cellDe(v){
  var p = v.clone().normalize(), best = -1, bd = -2;
  for(var i = 0; i < CELLS.length; i++){
    var c = CELLS[i].c, d = p.x*c[0] + p.y*c[1] + p.z*c[2];
    if(d > bd){ bd = d; best = i; }
  }
  return best;
}

/* ═══════════════ le voisinage ═══════════════
   Deux cellules sont voisines si elles partagent une arête, donc si leurs
   centres sont plus proches que la distance typique entre centres. On le
   calcule une fois : 642 cellules, six voisins chacune. */
var VOISINS = null;
function calculerVoisins(){ VOISINS = ADJ; }
function autourDe(i, rangs){
  if(!VOISINS) calculerVoisins();
  var vus = {}, bord = [i], out = [i];
  vus[i] = 1;
  for(var r = 0; r < rangs; r++){
    var suiv = [];
    bord.forEach(function(c){
      VOISINS[c].forEach(function(v){
        if(!vus[v]){ vus[v] = 1; out.push(v); suiv.push(v); }
      });
    });
    bord = suiv;
  }
  return out;
}

/* ═══════════════ le repère local d'une cellule ═══════════════ */
function repere(i){
  var c = CELLS[i].c;
  var up = new THREE.Vector3(c[0], c[1], c[2]);
  var ref = Math.abs(c[1]) < .92 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  var est = new THREE.Vector3().crossVectors(ref, up).normalize();
  var nord = new THREE.Vector3().crossVectors(up, est).normalize();
  return { up:up, est:est, nord:nord };
}
/* rayon typique d'une cellule, en unités de scène */
var RCELL = .789;

/* ═══════════════ le diorama ═══════════════
   Même structure que le globe — des prismes hexagonaux — mais le dessus de
   chaque cellule est subdivisé et bruité, et la couleur varie légèrement d'un
   triangle à l'autre. De près, c'est ce grain-là qui fait la différence, bien
   plus que le nombre de polygones. */
var patch = null, patchEau = null, patchCells = null;
var eauBase = null, eauGeo = null;
var NSUB = 4;                        /* subdivision du dessus ET des parois */

function bruitFin(x, y, z){ return fbm(x*46, y*46, z*46, 4, 1); }

/* Un point du bord d'une case, entre deux coins. Le dessus subdivisé et la
   paroi doivent passer par EXACTEMENT les mêmes points : c'est la seule façon
   qu'ils se rejoignent. Une paroi tendue en ligne droite d'un coin à l'autre
   passe sous le terrain bruité par endroits — et on voit alors à travers. */
function bordCell(cel, k, t){
  var B = cel.coins[k], C = cel.coins[(k + 1) % cel.coins.length];
  return new THREE.Vector3(B[0] + (C[0]-B[0])*t, B[1] + (C[1]-B[1])*t,
    B[2] + (C[2]-B[2])*t).normalize();
}

/* hauteur d'un point du dessus, épaule comprise : le dessus et la paroi
   doivent l'appeler tous les deux, faute de quoi ils ne se rejoignent pas */
function hautDessus(p, e, a0, o, plat){
  /* pas d'épaule sur l'eau : deux cases d'océan voisines doivent se rejoindre
     sans rainure, sinon on aperçoit la roche entre elles et la mer se lit
     comme une banquise fendue */
  return e + hautSol(p, o, plat) - (plat ? 0 : epaule(a0));
}
function construirePatch(centre, o){
  retirerPatch();
  prepCouleurs(o);
  patchCells = autourDe(centre, RANGS);
  var pos = [], col = [], idx = [], N = NSUB;
  var epos = [], eidx = [];          /* l'eau : sa propre surface, son matériau */
  var cb = new THREE.Color(), cr = new THREE.Color();
  var f = R0 - FOND;
  patchCells.forEach(function(i){
    var cel = CELLS[i], bio = bioDe(i);
    var e = R0 + hauteurCell(i, o);
    var plat = (bio === "ocean");
    var self = COULEURS[i];
    var ctr = new THREE.Vector3(cel.c[0], cel.c[1], cel.c[2]);
    var n = cel.coins.length;
    var cc = [];
    for(var kc = 0; kc < n; kc++) cc.push(coinCouleur(i, kc));

    /* Sommets partagés à l'intérieur de la case : les normales s'y moyennent
       et le terrain devient lisse au lieu d'être une mosaïque de facettes. */
    var carte = {}, locP = [], locC = [], locI = [];
    function sommet(k, u, v){
      var cle = (u === 0 && v === 0) ? "c"
        : (v === 0) ? ("r" + k + "_" + u)
        : (u === 0) ? ("r" + ((k+1) % n) + "_" + v)
        : (k + "_" + u + "_" + v);
      if(carte[cle] !== undefined) return carte[cle];
      var a1 = u/N, a2 = v/N, a0 = 1 - a1 - a2;
      var B = cel.coins[k], Cq = cel.coins[(k+1) % n];
      var p = new THREE.Vector3(
        ctr.x*a0 + B[0]*a1 + Cq[0]*a2,
        ctr.y*a0 + B[1]*a1 + Cq[1]*a2,
        ctr.z*a0 + B[2]*a1 + Cq[2]*a2).normalize();
      var hh = hautDessus(p, e, a0, o, plat);
      var id = locP.length / 3;
      locP.push(p.x*hh, p.y*hh, p.z*hh);
      /* la couleur du pourtour est celle des coins, partagée avec les voisines :
         les deux côtés d'une arête tombent donc sur exactement la même teinte */
      var s = a1 + a2, t = s > 1e-6 ? a2/s : 0;
      var rr = cc[k][0] + (cc[(k+1)%n][0] - cc[k][0])*t;
      var gg = cc[k][1] + (cc[(k+1)%n][1] - cc[k][1])*t;
      var bb = cc[k][2] + (cc[(k+1)%n][2] - cc[k][2])*t;
      var m = melange(a0);
      locC.push(self.r + (rr-self.r)*m, self.g + (gg-self.g)*m, self.b + (bb-self.b)*m);
      carte[cle] = id;
      return id;
    }
    for(var k = 0; k < n; k++){
      for(var u = 0; u < N; u++){
        for(var v = 0; v < N - u; v++){
          locI.push(sommet(k,u,v), sommet(k,u+1,v), sommet(k,u,v+1));
          if(v + u < N - 1) locI.push(sommet(k,u+1,v), sommet(k,u+1,v+1), sommet(k,u,v+1));
        }
      }
    }
    if(plat){
      var be = epos.length / 3;
      for(var z = 0; z < locP.length; z++) epos.push(locP[z]);
      for(var z2 = 0; z2 < locI.length; z2++) eidx.push(be + locI[z2]);
    } else {
      var b0 = pos.length / 3;
      for(var z3 = 0; z3 < locP.length; z3++) pos.push(locP[z3]);
      for(var z4 = 0; z4 < locC.length; z4++) col.push(locC[z4]);
      for(var z5 = 0; z5 < locI.length; z5++) idx.push(b0 + locI[z5]);
    }

    /* Les parois. Sous l'eau ce n'est pas de l'eau mais de la roche : une case
       d'océan est un bassin, pas un cube bleu. Elles sont poussées d'un cheveu
       vers l'extérieur pour passer devant celles du globe qu'elles recouvrent —
       sans cela les deux se disputent le même plan. */
    cb.set(plat ? 0x60594F : teinte(bio, o)).convertSRGBToLinear();
    /* Une paroi est un plan qui passe par le centre de la planète : la grandir
       d'un facteur la fait glisser dans son propre plan sans jamais la décoller
       de celle du globe qu'elle recouvre — d'où le moiré. Il faut la pousser
       perpendiculairement, vers l'extérieur de sa case. */
    var EPS = .011;
    for(var k3 = 0; k3 < n; k3++){
      var prev = null, dh = null;
      for(var s2 = 0; s2 <= N; s2++){
        var q2 = bordCell(cel, k3, s2 / N);
        /* sous l'eau la paroi s'arrête un peu plus bas : poussée vers
           l'extérieur, elle dépasserait sinon chez la case voisine et
           dessinerait un liseré sombre au milieu de la mer */
        var haut = q2.clone().multiplyScalar(hautDessus(q2, e, 0, o, plat)
          - (plat ? .035 : 0));
        var bas = q2.clone().multiplyScalar(f);
        if(prev){
          var deh = new THREE.Vector3().crossVectors(q2, dh).normalize().multiplyScalar(EPS);
          var bs = pos.length / 3;
          [prev.h, haut, bas, prev.b].forEach(function(p){
            pos.push(p.x + deh.x, p.y + deh.y, p.z + deh.z);
          });
          [.95, .95, .68, .68].forEach(function(g){
            cr.copy(cb).multiplyScalar(g);
            col.push(cr.r, cr.g, cr.b);
          });
          idx.push(bs, bs+2, bs+1, bs, bs+3, bs+2);
        }
        prev = { h:haut, b:bas }; dh = q2.clone();
      }
    }
  });
  var g2 = new THREE.BufferGeometry();
  g2.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g2.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g2.setIndex(new THREE.Uint32BufferAttribute(idx, 1));
  g2.computeVertexNormals();
  /* le diorama recouvre exactement les cases grossières : sans ce décalage de
     profondeur, les deux parois se disputent le même plan et l'arête scintille */
  /* Surtout pas de polygonOffset ici : avec un facteur proportionnel à la
     pente, une surface vue par la tranche se retrouve tirée de plusieurs unités
     vers l'œil et traverse la colline qui la cache. C'était la cause des
     « trous » qu'on voyait dès qu'il y avait du relief. */
  patch = new THREE.Mesh(g2, new THREE.MeshStandardMaterial({ vertexColors:true,
    roughness:.95, metalness:0 }));
  patch.receiveShadow = true; patch.castShadow = true;
  monde.add(patch);

  if(epos.length){
    eauGeo = new THREE.BufferGeometry();
    eauGeo.setAttribute("position", new THREE.Float32BufferAttribute(epos, 3));
    eauGeo.setIndex(new THREE.Uint32BufferAttribute(eidx, 1));
    eauGeo.computeVertexNormals();
    eauBase = Float32Array.from(epos);
    /* lisse et peu rugueuse : c'est le reflet du soleil rasant qui fait l'eau,
       bien plus que sa couleur */
    patchEau = new THREE.Mesh(eauGeo, new THREE.MeshStandardMaterial({
      color:C(o.eau ? 0x2F7BAC : 0x5F5A51), roughness:o.eau ? .34 : .9,
      metalness:0, transparent:!!o.eau, opacity:o.eau ? .94 : 1 }));
    patchEau.receiveShadow = true;
    monde.add(patchEau);
  }
  return patch;
}
/* une houle très lente : quelques millimètres suffisent à faire bouger le
   reflet, et c'est le reflet qui se voit */
var tEau = 0;
function houle(dt){
  if(!patchEau || !eauBase || !M.glob.eau) return;
  tEau += dt;
  var a = eauGeo.attributes.position, p = a.array;
  for(var k = 0; k < p.length; k += 3){
    var x = eauBase[k], y = eauBase[k+1], z = eauBase[k+2];
    var s = 1 + .0016 * Math.sin(x*3.1 + tEau*1.15) + .0012 * Math.sin(z*4.3 - tEau*.8);
    p[k] = x*s; p[k+1] = y*s; p[k+2] = z*s;
  }
  a.needsUpdate = true;
  /* recalculer les normales fait bouger le reflet : c'est lui qu'on voit */
  eauGeo.computeVertexNormals();
}
function retirerPatch(){
  if(patch){ monde.remove(patch); patch.geometry.dispose(); patch = null; }
  if(patchEau){ monde.remove(patchEau); patchEau.geometry.dispose(); patchEau = null; }
  eauBase = null; eauGeo = null;
  patchCells = null;
}

/* ═══════════════ état de la vue ═══════════════ */
var VUE = "orbite";                 /* orbite · descente · sol · remontee */
var SOL_CELL = -1;
var solCam = { el: .88, r: 4.4 };
/* On ne reste pas posé sur une case : on garde un point de la sphère, un cap
   tangent, et une référence tangente qui ne tourne jamais avec le regard. Les
   trois se transportent ensemble quand on se déplace, si bien qu'aucun repère
   ne saute au passage d'une case — ni aux pôles, où un repère construit sur
   l'axe du monde se retournerait. */
var solPos = new THREE.Vector3(0, 1, 0);
var solAv  = new THREE.Vector3(0, 0, 1);
var solRef = new THREE.Vector3(0, 0, 1);
var solAlt = 0;
var TR = null;                      /* transition en cours */
var PLAFOND = 0;                    /* rayon sous lequel la caméra serait dans la roche */
var cielG = null, cielS = null, cibleSol = null, bancs = null;
var props = [], decorsG = [], detailles = [];
var selSol = null, selDec = null, armeDeplacer = false;
var UP = new THREE.Vector3(0, 1, 0);

/* ═══════════════ le ciel et la brume ═══════════════ */
function texCiel(){
  var c = document.createElement("canvas"); c.width = 4; c.height = 256;
  var x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, "#14306B"); g.addColorStop(.40, "#5E8FC4");
  g.addColorStop(.74, "#C8B79C"); g.addColorStop(1, "#E3A877");
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}
function preparerCiel(){
  cielG = new THREE.Group(); monde.add(cielG);
  cielS = new THREE.Mesh(new THREE.SphereGeometry(150, 24, 18),
    new THREE.MeshBasicMaterial({ map:texCiel(), side:THREE.BackSide,
      transparent:true, opacity:0, depthWrite:false, fog:false }));
  cielS.visible = false; cielG.add(cielS);
  /* La couche de nuages du globe est une coquille à R0×1.30 : en descendant on
     passe dessous, et de près elle masquerait le sol. On l'efface donc, et on
     rend au ciel des bancs lointains, posés bas sur l'horizon local — c'est là
     qu'on les voit quand on est dedans plutôt qu'au-dessus. */
  bancs = new THREE.Group(); bancs.visible = false; cielG.add(bancs);
  var mb = new THREE.MeshBasicMaterial({ color:C(0xF6F8FC), transparent:true,
    opacity:0, depthWrite:false, fog:false });
  for(var i = 0; i < 14; i++){
    var az = (i / 14) * 6.28319 + alea(i * 3) * .4;
    var el = .13 + alea(i * 5) * .42, R = 78 + alea(i * 7) * 34;
    var g = new THREE.Group();
    for(var k = 0; k < 4; k++){
      var s = new THREE.Mesh(new THREE.IcosahedronGeometry(3.4 + alea(i*11 + k) * 2.6, 1), mb);
      s.position.set((k - 1.5) * 4.6, alea(i*13 + k) * 1.4, alea(i*17 + k) * 3 - 1.5);
      s.scale.set(1.5, .46, 1);
      g.add(s);
    }
    g.position.set(Math.cos(az) * Math.cos(el) * R, Math.sin(el) * R,
      Math.sin(az) * Math.cos(el) * R);
    g.lookAt(0, Math.sin(el) * R, 0);
    bancs.add(g);
  }
  scene.fog = new THREE.FogExp2(new THREE.Color(0xA6BCD2).convertSRGBToLinear(), 0);
  /* le soleil doit viser la case et non le centre de la planète, sinon la boîte
     d'ombre — étroite par nécessité — ne couvre pas le diorama */
  cibleSol = new THREE.Object3D(); scene.add(cibleSol);
  soleil.target = cibleSol;
}
/* k va de 0 (orbite) à 1 (sol). Tout ce qui fait « l'intérieur d'une
   atmosphère » monte ensemble : le voile du ciel, la brume, l'effacement des
   étoiles, et le soleil qui descend sur l'horizon en se réchauffant. */
function ambiance(k){
  if(!cielS) return;
  cielS.visible = k > .01;
  cielS.material.opacity = k * .97;
  scene.fog.density = k * .021;
  if(etoiles) etoiles.material.opacity = .75 * (1 - k * .96);
  if(halo) halo.material.opacity = .14 + k * .20;
  /* le passage sous la couche : elle s'efface entre 35 % et 70 % de la descente,
     les bancs lointains prennent le relais juste après */
  if(nuages){
    var fn = Math.max(0, Math.min(1, (k - .35) / .35));
    nuages.visible = fn < .99;
    nuages.traverse(function(o){ if(o.isMesh) o.material.opacity = .82 * (1 - fn); });
  }
  if(bancs){
    var fb = M.glob.nuages ? Math.max(0, Math.min(1, (k - .55) / .30)) : 0;
    bancs.visible = fb > .01;
    bancs.traverse(function(o){ if(o.isMesh) o.material.opacity = fb * .9; });
  }
  if(SOL_CELL < 0) return;
  var b = baseSol();
  /* le ciel et le soleil s'accrochent à la référence, pas au cap : tourner la
     tête ne fait pas tourner les nuages ni le soleil avec soi */
  var rf = solRef.clone().sub(b.up.clone().multiplyScalar(solRef.dot(b.up))).normalize();
  var rd = new THREE.Vector3().crossVectors(rf, b.up).normalize();
  cielG.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(rd, b.up, rf));
  var el = (1 - k) * 1.05 + k * .40;
  var dir = b.up.clone().multiplyScalar(Math.sin(el))
    .add(rd.clone().multiplyScalar(Math.cos(el) * .84))
    .add(rf.clone().multiplyScalar(Math.cos(el) * .54)).normalize();
  var mr = new THREE.Matrix4().extractRotation(monde.matrixWorld);
  var e = R0 + solAlt;
  var cp = b.up.clone().multiplyScalar(e).applyMatrix4(mr);
  cibleSol.position.copy(cp);
  soleil.position.copy(cp.clone().add(dir.applyMatrix4(mr).multiplyScalar(26)));
  soleil.intensity = 1.05 + k * .22;
  /* de près, les faces rasantes deviennent des trous noirs : l'ambiante remonte
     avec la descente, et se réchauffe avec le soleil */
  if(ambiant) ambiant.intensity = .22 + k * .06;
  if(hemi){
    hemi.intensity = .55 + k * .30;
    hemi.color.set(new THREE.Color(0x9FC4F0).convertSRGBToLinear());
    /* au sol, la lumière qui remonte du sol est chaude et compte beaucoup */
    hemi.groundColor.set(new THREE.Color(k > .5 ? 0x8A6E4C : 0x6B5B42).convertSRGBToLinear());
  }
  soleil.color.set(new THREE.Color(k > .55 ? 0xFFE2B6 : 0xFFF4E2).convertSRGBToLinear());
}
function soleilOrbite(){
  soleil.position.set(1, .62, .8);
  if(cibleSol) cibleSol.position.set(0, 0, 0);
  soleil.intensity = 1.05;
  soleil.color.set(new THREE.Color(0xFFF4E2).convertSRGBToLinear());
}

/* ═══════════════ points dans une cellule ═══════════════
   hautSol est la seule source de vérité du relief fin : le diorama s'en sert
   pour déplacer ses sommets, et la pose s'en sert pour savoir où est le sol.
   Le décalage constant garantit que le diorama passe toujours au-dessus des
   cellules grossières qu'il recouvre, au lieu de les traverser. */
function hautSol(p, o, plat){
  return .055 + (plat ? 0 : bruitFin(p.x, p.y, p.z) * .062);
}
function pointCell(i, a, d, o){
  var rep = repere(i), plat = (bioDe(i) === "ocean");
  var e = R0 + hauteurCell(i, o);
  var dir = rep.est.clone().multiplyScalar(Math.cos(a))
    .add(rep.nord.clone().multiplyScalar(Math.sin(a)));
  var p = rep.up.clone().multiplyScalar(e).add(dir.multiplyScalar(d * RCELL)).normalize();
  return p.multiplyScalar(e + hautSol(p, o, plat) - epaule(Math.max(0, 1 - d)));
}
/* l'inverse : d'un point du terrain vers (angle, distance) dans sa cellule */
function angleDist(i, v){
  var rep = repere(i), p = v.clone().normalize();
  var proj = p.clone().sub(rep.up.clone().multiplyScalar(p.dot(rep.up)));
  var x = proj.dot(rep.est), y = proj.dot(rep.nord);
  var d = Math.sqrt(x*x + y*y) * (R0 + hauteurCell(i, M.glob)) / RCELL;
  return { a: Math.atan2(y, x), d: Math.min(.80, d) };
}
function alea(s){
  var v = Math.sin(s * 91.7 + 13.3 + GRAINE * .0013) * 43758.5453;
  return v - Math.floor(v);
}

/* ═══════════════ herbes et cailloux ═══════════════
   Des milliers de brins ne coûtent qu'un appel de dessin chacun : c'est ce qui
   fait passer un terrain de « surface colorée » à « endroit ». */
function semerProps(o){
  semerRien();
  var brins = [], pierres = [];
  patchCells.forEach(function(i){
    var b = bioDe(i);
    if(b === "ocean" || b === "banquise") return;
    /* la densité se compte à l'hectare, pas à la case */
    var n = Math.max(4, Math.round(((b === "plaine" || b === "toundra") ? 105
      : (b === "desert" ? 26 : 48)) * ECHC * ECHC));
    for(var k = 0; k < n; k++){
      var a = alea(i*7 + k) * 6.28319, d = .06 + alea(i*11 + k*3) * .56;
      var p = pointCell(i, a, d, o);
      (k % 7 === 0 ? pierres : brins).push({ p:p, s:.6 + alea(i*5 + k) * .85, a:a });
    }
  });
  var mb = (M.glob.herbe ? 0x77A352 : 0x93836B);
  if(brins.length){
    var mh = mm(mb, 1); mh.vertexColors = true;
    props.push(instancier(geoBrin(), mh, brins, .12));
  }
  if(pierres.length){
    var mp = mm(0x8C8072, .95); mp.vertexColors = true;
    props.push(instancier(new THREE.DodecahedronGeometry(.020, 0), mp, pierres, .10));
  }
  props.forEach(function(p){ monde.add(p); });
}
function semerRien(){ props.forEach(function(p){ monde.remove(p); }); props = []; }
/* De l'herbe, pas des lames : à cette échelle un brin trop grand se lit comme
   un éclat de verre planté dans le sol. */
function geoBrin(){
  var g = new THREE.ConeGeometry(.010, .055, 3);
  g.translate(0, .0275, 0);
  return g;
}
/* varie : un peu de teinte d'un brin à l'autre. Une pelouse d'un seul vert se
   lit comme une moquette ; deux pour cent d'écart suffisent à faire un pré. */
function instancier(geo, mat, liste, varie){
  /* Dans cette version de three, la couleur par instance n'est appliquée que si
     le matériau déclare des couleurs de sommets — et il lui faut alors un
     attribut de couleur, fût-il tout blanc. Sans lui, tout sort noir. */
  if(varie && !geo.attributes.color){
    var n = geo.attributes.position.count, blanc = new Float32Array(n*3);
    for(var z = 0; z < n*3; z++) blanc[z] = 1;
    geo.setAttribute("color", new THREE.BufferAttribute(blanc, 3));
  }
  var m2 = new THREE.InstancedMesh(geo, mat, liste.length);
  m2.castShadow = true; m2.receiveShadow = true;
  var d = new THREE.Object3D(), c = new THREE.Color();
  liste.forEach(function(q, k){
    d.position.copy(q.p);
    d.quaternion.setFromUnitVectors(UP, q.p.clone().normalize());
    d.rotateY(q.a); d.scale.setScalar(q.s); d.updateMatrix();
    m2.setMatrixAt(k, d.matrix);
    if(varie){
      var t = alea(k*31 + 7);
      c.setRGB(1 + (t-.5)*varie*1.6, 1 + (t-.5)*varie, 1 - (t-.5)*varie*.8);
      m2.setColorAt(k, c);
    }
  });
  m2.instanceMatrix.needsUpdate = true;
  if(varie && m2.instanceColor) m2.instanceColor.needsUpdate = true;
  return m2;
}

/* ═══════════════ variantes détaillées ═══════════════
   Même objet, même place, plus de matière : c'est la récompense de la descente.
   Ce qui n'a pas de variante garde sa forme — elle tient déjà de près. */
function troncFin(h, r){
  var g = new THREE.Group();
  for(var k = 0; k < 3; k++){
    var s = cy(r*(1 - k*.22), r*(1 - (k+1)*.22), h/3, MAT.tronc, 7);
    s.position.y = h*(k/3) + h/6;
    s.rotation.z = (k - 1) * .04;
    g.add(s);
  }
  return g;
}
function feuillage(y, r, mat, n, sd){
  var g = new THREE.Group();
  for(var k = 0; k < n; k++){
    var b = new THREE.Mesh(new THREE.IcosahedronGeometry(r * (.62 + alea(sd+k)*.5), 0), mat);
    b.position.set((alea(sd+k*3) - .5) * r * 1.1, y + (alea(sd+k*5) - .4) * r * .8,
      (alea(sd+k*7) - .5) * r * 1.1);
    b.rotation.set(alea(sd+k)*3, alea(sd+k*2)*3, 0);
    g.add(b);
  }
  return g;
}
function arbre2(h, sd){
  var g = new THREE.Group();
  g.add(troncFin(h*.52, .055));
  g.add(feuillage(h*.78, h*.38, MAT.feuille, 5, sd));
  return g;
}
function sapin2(h, sd){
  var g = new THREE.Group();
  var t = cy(.032, .048, h*.34, MAT.tronc, 6); t.position.y = h*.17; g.add(t);
  for(var k = 0; k < 5; k++){
    var c = cn(.19 - k*.032, h*.30, MAT.sapin, 8);
    c.position.y = h*(.26 + k*.155);
    c.rotation.y = k * .5;
    g.add(c);
  }
  var n2 = cn(.055, h*.16, MAT.neige, 8); n2.position.y = h*1.02; g.add(n2);
  return g;
}
function maison2(s, sd){
  var g = new THREE.Group();
  var m = bt(.26*s, .24*s, .28*s, MAT.mur); m.position.y = .12*s; g.add(m);
  var t = cn(.235*s, .20*s, MAT.toit, 4); t.position.y = .33*s; t.rotation.y = .785; g.add(t);
  var p = bt(.07*s, .12*s, .012, MAT.tronc); p.position.set(0, .06*s, .142*s); g.add(p);
  var f = bt(.055*s, .055*s, .012, MAT.lave); f.position.set(.075*s, .16*s, .142*s); g.add(f);
  var ch = bt(.05*s, .12*s, .05*s, MAT.roche); ch.position.set(-.07*s, .38*s, .05*s); g.add(ch);
  g.rotation.y = alea(sd) * 6.28319;
  return g;
}
var FAIRE2 = {
  arbre: function(){ return arbre2(.66, 3); },
  foret: function(){
    var g = new THREE.Group();
    [[0,0,.66],[.26,.15,.52],[-.24,.11,.58],[.07,-.26,.48],[-.16,-.20,.45],

      var a = arbre2(p[2], 11 + k*4);
      a.position.set(p[0], 0, p[1]); a.rotation.y = alea(k*9) * 6.28319; g.add(a);
    });

  },
  sapins: function(){
    var g = new THREE.Group();
    [[0,0,.74],[.24,.17,.54],[-.22,-.13,.60],[.10,-.28,.46]].forEach(function(p, k){
      var s = sapin2(p[2], 23 + k*3);
      s.position.set(p[0], 0, p[1]); g.add(s);
    });
    return g;
  },
  rocher: function(){
    var g = new THREE.Group();
    [[0,0,.30],[.22,.15,.19],[-.19,-.13,.15],[.13,-.22,.11],[-.24,.14,.09]]
      .forEach(function(p, k){
        var r = new THREE.Mesh(new THREE.DodecahedronGeometry(p[2], 0), MAT.roche);
        r.position.set(p[0], p[2]*.78, p[1]);

    }

  },
  village: function(){
    var g = new THREE.Group();
    [[0,0,1],[.28,.20,.82],[-.26,.17,.88],[.05,-.28,.76]].forEach(function(p, k){
      var m = maison2(p[2], 31 + k*5);

  },
  champs: function(){
    var g = new THREE.Group();

  },
  lac: function(){
    var g = new THREE.Group();

  cactus: function(){

      var t = cy(.085*p[2], .10*p[2], .55*p[2], MAT.cactus, 11);
      t.position.set(p[0], .275*p[2], p[1]); g.add(t);

  palmier: function(){
    var g = new THREE.Group();
    [[0,0,1],[.24,.17,.78],[-.22,-.15,.86]].forEach(function(p, k){
      var h = .62 * p[2];
      for(var s = 0; s < 4; s++){

        t.rotation.z = -.07 * s; g.add(t);
      }
      for(var j = 0; j < 6; j++){

  var p = pointCell(i, q.a || 0, q.d || 0, M.glob);
  g.position.copy(p.clone().multiplyScalar(1.0013));
  g.quaternion.setFromUnitVectors(UP, p.clone().normalize());
  if(q.r) g.rotateY(q.r);
}

  placerLibre(i, g, M.pos[i] || { a:0, d:0, r:0 });
}

  decorsG = [];
